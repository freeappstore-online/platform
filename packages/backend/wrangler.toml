name = "freeappstore-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
# Serve only on the custom domain below. The key-resolve endpoints trust the
# service-binding host, so no other public hostname may reach this Worker (#427).
workers_dev = false
preview_urls = false

# Attach api.freeappstore.online to this Worker. With custom_domain = true,
# wrangler creates the DNS record and provisions TLS as part of deploy.
[[routes]]
pattern = "api.freeappstore.online"
zone_name = "freeappstore.online"
custom_domain = true

# Public, non-secret config. The OAuth App lives at:
# https://github.com/organizations/freeappstore-online/settings/applications/3576238
[vars]
GITHUB_CLIENT_ID = "Ov23liuUpYPXc1ikEFm2"
VAPID_PUBLIC_KEY = "BIlVvIX9EX-NSIUGqt_DNiQWC_-SRUO7aLeu-SWNSWXqMC0ilLSCIkJ_Noa6GBn2UhC5z0OLJ2Pu2Yk8NcoSqyg"
# Account that owns the ANALYTICS dataset below; the stats endpoints query it
# through the Analytics Engine SQL API. Same public id the admin Worker exposes.
CF_ACCOUNT_ID = "c1089bfcc43c1c6c2aa89e584e86f0bc"

# Workers Analytics Engine — first-party cookieless page-view analytics.
# POST /v1/analytics/event writes here; the creator dashboard reads it back
# through the SQL API (CF_ACCOUNT_ID + CF_ANALYTICS_API_TOKEN). The dataset is
# created on first write. `dataset` MUST equal STATS_DATASET in
# src/routes/analytics.ts — the read side names it in SQL and nothing else
# links the two (analytics.test.ts checks this).
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "fas_app_analytics"

# Native Cloudflare Email Service is used for magic-link and app
# transactional email. The sending domain must be onboarded in the
# Cloudflare dashboard before this Worker is deployed.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = [
  "auth@freeappstore.online",
  "noreply@freeappstore.online",
  "support@freeappstore.online",
]

[[d1_databases]]
binding = "DB"
database_name = "fas"
database_id = "a32701c0-5a56-4a12-810d-485166202e39"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
# new_sqlite_classes (vs new_classes) is required on the free plan — it
# uses the SQLite-backed Durable Object storage backend instead of the
# legacy KV-backed one.
new_sqlite_classes = ["Room"]

# Cron triggers. The Worker's `scheduled` handler dispatches on the
# `event.cron` value, so each schedule below corresponds to one task:
#   */15 * * * *    uptime checks against every published app
#   0 3 * * *       daily log prune (entries > 7 days)
#   0 4 * * *       daily D1 → R2 backup at 04:00 UTC
#   0 6 * * SUN     weekly compliance audit — Sunday 06:00 UTC
[triggers]
crons = ["*/15 * * * *", "0 3 * * *", "0 4 * * *", "0 6 * * SUN"]

# R2 bucket for daily D1 backups. The 0 4 * * * cron writes a JSON
# dump of D1 here. See src/lib/backup.ts.
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "fas-backups"

# R2 bucket for app assets (deployed app files, VCQA reports, badges).
# The host Worker serves app content from here; the backend reads VCQA
# reports for the /v1/apps/:id/quality endpoint.
[[r2_buckets]]
binding = "APPS_BUCKET"
bucket_name = "fas-apps"

# Service binding to the admin Worker for /v1/publish → /api/provision.
# Worker-to-worker direct: bypasses CF Access (both are trusted internal),
# bypasses edge loop detection (the cause of the earlier 522s), and removes
# the need to manage a service token in our secret store.
[[services]]
binding = "ADMIN"
service = "freeappstore-admin"

# Secrets (managed from the private SOPS secrets repo and synced with wrangler):
#   GITHUB_CLIENT_SECRET     # generated on the OAuth App settings page
#   SESSION_SIGNING_KEY      # 32+ bytes, e.g. `openssl rand -hex 32`
#   APP_SECRET_KEK           # 32-byte base64 key for envelope encryption of app secrets
#   ADMIN_PROVISION_TOKEN    # backend→admin service-binding auth
#   CROSS_STORE_REGISTER_TOKEN # PAS→FAS app registration auth
#   COMP_KEY_OPENAI          # platform-funded OpenAI key for complimentary VibeCode grants
#   COMP_KEY_ANTHROPIC       # platform-funded Anthropic key for complimentary VibeCode grants
#   COMP_KEY_GOOGLE          # platform-funded Google AI key for complimentary VibeCode grants
#   VAPID_PRIVATE_KEY        # Web Push VAPID private key, base64url (fas.push, #145); managed as fas/VAPID_PRIVATE_KEY in ~/dev/ops
#   CF_ANALYTICS_API_TOKEN   # CF API token with Account Analytics:Read; the analytics stats endpoints 503 without it

# User photos only. Never apply upload expiry to deployed assets or backups.
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "fas-uploads"
