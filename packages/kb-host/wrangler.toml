name = "freeappstore-kb-host"
main = "src/index.ts"
compatibility_date = "2026-01-01"
workers_dev = false

# Dedicated subdomain (NOT a wildcard) — serves Knowledge Base sites only, so it
# does NOT preempt sibling Worker custom_domains on the zone (the
# wildcard-worker-route-preemption hazard applies only to *.freeappstore.online/*).
# custom_domain auto-provisions the DNS record + managed cert on deploy IF the
# deploy token has DNS edit; otherwise add it once in the dashboard
# (Workers → freeappstore-kb-host → Domains & Routes → Custom Domain).
[[routes]]
pattern = "kb.freeappstore.online"
custom_domain = true

[[routes]]
pattern = "docs.freeappstore.online"
custom_domain = true

# Shared KB bucket — CI uploads each app's built Zensical site to "<app>/*" here.
# One bucket for every KB; no per-KB resource.
[[r2_buckets]]
binding = "KB_R2"
bucket_name = "fas-kb"
