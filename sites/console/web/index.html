<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // The console is served at BOTH console.freeappstore.online/ and
      // freeappstore.online/app/ (the storefront proxy strips /app server-side
      // but the browser URL keeps it). Vite uses a relative asset base, which
      // only resolves at the mount root — at deeper routes like /app/build/ or
      // /app/build/app/<id> the browser would look for /app/build/assets/* and
      // 404. Emit a <base> matching the mount so relative assets + manifest
      // always resolve to the mount root regardless of route depth.
      (function () {
        var p = location.pathname;
        var base = (p === '/app' || p.indexOf('/app/') === 0) ? '/app/' : '/';
        document.write('<base href="' + base + '">');
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" id="theme-color" />
    <meta name="darkreader-lock" />
    <script>
      if (matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Creator Console — FreeAppStore</title>
    <!-- CF Web Analytics beacon for the console itself. Cookieless, no PII.
         Token is the literal string until set; replace PROAPPSTORE_CONSOLE_CF_BEACON_TOKEN
         with the real Web Analytics site_token from the CF dashboard
         (or wire a build-time substitution if/when the console grows a build pipeline). -->
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js"
            data-cf-beacon='{"token":"FREEAPPSTORE_CONSOLE_CF_BEACON_TOKEN"}'></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
