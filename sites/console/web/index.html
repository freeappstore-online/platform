<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // The console is served at BOTH console.freeappstore.online/ and
      // freeappstore.online/app/ (the storefront proxy strips /app server-side
      // but the browser URL keeps it). Vite uses a relative asset base, which
      // only resolves at the mount root — at deeper routes like /app/build/ or
      // /app/build/app/<id> the browser would look for /app/build/assets/* and
      // 404. Emit a <base> matching the mount so relative assets + manifest
      // always resolve to the mount root regardless of route depth.
      (function () {
        var p = location.pathname;
        var base = (p === '/app' || p.indexOf('/app/') === 0) ? '/app/' : '/';
        document.write('<base href="' + base + '">');
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" id="theme-color" />
    <meta name="darkreader-lock" />
    <script>
      (function () {
        var stored = localStorage.getItem('stores-theme');
        if (stored === 'dark') {
          document.documentElement.dataset.theme = 'dark';
        } else if (stored === 'light') {
          // explicit light — leave data-theme absent
        } else if (matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <script>
      (function () {
        var t = localStorage.getItem('stores-text-size');
        if (t === 'lg' || t === 'sm') document.documentElement.dataset.text = t;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Creator Console — FreeAppStore</title>
    <!-- CF Web Analytics beacon removed: it shipped with a placeholder site_token
         (never a real one), so it collected nothing and only threw a CORS error on
         cloudflareinsights.com/cdn-cgi/rum. Re-add a <script src=beacon.min.js> with
         a real Web Analytics site_token from the CF dashboard if console RUM is wanted. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
