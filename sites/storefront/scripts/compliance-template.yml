name: Platform Compliance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: MIT License
        run: grep -qi "MIT" LICENSE

      - name: No .env.production in repo
        run: test ! -f .env.production && test ! -f web/.env.production

      - name: No tracking
        run: |
          FORBIDDEN="google-analytics|gtag|amplitude|mixpanel|segment|hotjar|plausible|posthog"
          ! grep -rE "$FORBIDDEN" web/src/ 2>/dev/null
          ! grep -E "$FORBIDDEN" web/package.json 2>/dev/null

      - name: Brand fonts
        run: |
          CSS_FILE=$(find web/src -name "index.css" | head -1)
          grep -qi "manrope" "$CSS_FILE"
          grep -qi "fraunces" "$CSS_FILE"

      - name: CSS variables
        run: |
          CSS_FILE=$(find web/src -name "index.css" | head -1)
          grep -q "\-\-paper" "$CSS_FILE"
          grep -q "\-\-ink" "$CSS_FILE"
          grep -q "\-\-accent" "$CSS_FILE"

      - name: HTML meta tags
        run: |
          grep -q 'lang=' web/index.html
          grep -q 'viewport' web/index.html
          grep -q '<title>' web/index.html

      - name: PWA manifest
        run: |
          MANIFEST=$(find web/public -name "manifest.json" | head -1)
          test -n "$MANIFEST"
          grep -q "name" "$MANIFEST"
          grep -q "display" "$MANIFEST"
          grep -q "start_url" "$MANIFEST"

      - name: PWA meta tags
        run: |
          grep -qi "apple-mobile-web-app-capable\|mobile-web-app-capable" web/index.html

      - name: FreeAppStore link
        run: grep -r "freeappstore.online" web/src/ | grep -q .

      - name: Dark mode
        run: grep -rE "prefers-color-scheme|data-theme|color-scheme" web/src/ | grep -q .

      - name: pnpm workspace
        run: |
          grep -q "pnpm" package.json
          test -f pnpm-workspace.yaml

      - name: Bundle size
        run: |
          # Initial-load JS (HTML entry + static imports) ≤ 300KB gzip.
          # Lazy JS/wasm/workers/data ≤ 25MB each. Mirrors fas check bundle-size.
          node --input-type=module <<'EOF'
          import { existsSync, readdirSync, readFileSync, statSync } from 'node:fs';
          import { join } from 'node:path';
          import { gzipSync } from 'node:zlib';

          const INITIAL_MAX = 300 * 1024;
          const LAZY_MAX = 25 * 1024 * 1024;
          const dir = 'web/dist/assets';
          if (!existsSync(dir)) process.exit(0);
          const names = readdirSync(dir).filter((n) => {
            try { return statSync(join(dir, n)).isFile(); } catch { return false; }
          });
          const isJs = (n) => /\.(?:m|c)?js$/i.test(n);
          const isLazy = (n) =>
            !/\.map$/i.test(n) &&
            (isJs(n) || /\.(?:wasm|data|bin|onnx|tflite|traineddata|gz|zst)$/i.test(n));
          const attr = (tag, name) => {
            const m = new RegExp(`(?:^|\\s)${name}\\s*=\\s*(?:"([^"]*)"|'([^']*)')`, 'i').exec(tag);
            return m?.[1] ?? m?.[2];
          };
          const initial = new Set();
          const htmlPath = 'web/dist/index.html';
          if (existsSync(htmlPath)) {
            const html = readFileSync(htmlPath, 'utf8');
            const refs = [];
            for (const m of html.matchAll(/<script\b[^>]*>/gi)) {
              const src = attr(m[0], 'src');
              if (src) refs.push(src);
            }
            for (const m of html.matchAll(/<link\b[^>]*>/gi)) {
              if ((attr(m[0], 'rel') || '').toLowerCase() === 'modulepreload') {
                const href = attr(m[0], 'href');
                if (href) refs.push(href);
              }
            }
            for (const ref of refs) {
              const path = ref.split(/[?#]/, 1)[0].replace(/^\.\//, '');
              const mm = /(?:^|\/)assets\/(.+\.m?js)$/i.exec(path);
              if (mm) initial.add(mm[1]);
            }
            const seen = new Set();
            const queue = [...initial];
            const importRe =
              /(?:^|[\n;])\s*(?:import|export)\s*(?:type\s+)?(?:[^\n'"()]*?from\s*)?["'](\.[^"']+)["']/g;
            while (queue.length) {
              const file = queue.pop();
              if (!file || seen.has(file)) continue;
              seen.add(file);
              const full = join(dir, file);
              if (!existsSync(full)) continue;
              const text = readFileSync(full, 'utf8');
              for (const m of text.matchAll(importRe)) {
                const spec = m[1].split(/[?#]/, 1)[0];
                if (!isJs(spec)) continue;
                const fromDir = file.includes('/') ? file.slice(0, file.lastIndexOf('/')) : '';
                const parts = [...(fromDir ? fromDir.split('/') : []), ...spec.split('/')];
                const out = [];
                for (const p of parts) {
                  if (p === '.' || p === '') continue;
                  if (p === '..') out.pop();
                  else out.push(p);
                }
                const resolved = out.join('/');
                if (resolved && !seen.has(resolved)) {
                  initial.add(resolved);
                  queue.push(resolved);
                }
              }
            }
          }
          let initialJs = [...initial].filter((n) => names.includes(n));
          if (initialJs.length === 0) initialJs = names.filter(isJs);
          const initialSet = new Set(initialJs);
          let failed = false;
          for (const name of initialJs) {
            const gz = gzipSync(readFileSync(join(dir, name))).length;
            if (gz > INITIAL_MAX) {
              console.error(`${name}: ${(gz / 1024).toFixed(1)} KB gzipped (limit 300 KB initial load)`);
              failed = true;
            } else {
              console.log(`${name}: ${(gz / 1024).toFixed(1)} KB gzipped (initial load)`);
            }
          }
          for (const name of names) {
            if (initialSet.has(name) || !isLazy(name)) continue;
            const size = statSync(join(dir, name)).size;
            if (size > LAZY_MAX) {
              console.error(`${name}: ${(size / (1024 * 1024)).toFixed(1)} MB (limit 25 MB per lazy asset)`);
              failed = true;
            }
          }
          process.exit(failed ? 1 : 0);
          EOF
