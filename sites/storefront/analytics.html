<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics — FreeAppStore</title>
  <meta name="description" content="Visit your apps' analytics. Cookieless, no PII. Powered by Cloudflare Web Analytics + first-party page-view tracking." />
  <link rel="canonical" href="https://freeappstore.online/analytics.html" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  {{SETTINGS_BOOTSTRAP}}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{STYLE_CSS_URL}}" />
  <!-- CF Web Analytics for the storefront itself. -->
  __CF_BEACON__
</head>
<body>
  
  {{HEADER}}


  <main class="container">
    <section class="a-section">
      <h1 class="a-heading">Your analytics</h1>
      <p class="a-lede">
        Cookieless, no PII. The platform records page views and SPA route changes from every visitor;
        you can also wire Google Analytics, Plausible, or a custom &lt;head&gt; tag per app. Updated within a minute.
      </p>
      <div id="a-content">
        <p class="a-empty">Loading…</p>
      </div>
    </section>
  </main>
  {{FOOTER}}

  <script src="/auth.js?v={{VER_AUTH_JS}}" integrity="{{SRI_AUTH_JS}}"></script>
  <script src="/analytics.js?v={{VER_ANALYTICS_JS}}" integrity="{{SRI_ANALYTICS_JS}}" defer></script>
</body>
</html>
