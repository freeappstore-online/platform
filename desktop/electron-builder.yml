# Unsigned builds (#805), published by .github/workflows/desktop-release.yml. Signing and notarization: #799.
# Asset names carry no version so the download page can link to them stably.
appId: online.freeappstore.desktop
productName: FreeAppStore
directories:
  output: release
files:
  - dist/**
  - assets/**
  - package.json
# The stdio MCP entry (#815) runs as a plain file in node mode (ELECTRON_RUN_AS_NODE), outside the archive.
asarUnpack:
  - dist/stdio/**
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  # Ad-hoc signature ("-"): no certificate, but Apple Silicon refuses to start an unsigned app at all.
  identity: "-"
  artifactName: FreeAppStore-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
dmg:
  artifactName: FreeAppStore-mac-${arch}.${ext}
win:
  icon: build/icon.png
  artifactName: FreeAppStore-win-${arch}.${ext}
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: FreeAppStore-win-${arch}.${ext}
linux:
  icon: build/icon.png
  category: Utility
  artifactName: FreeAppStore-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch: [x64]
# Updates (#839): electron-updater reads this from app-update.yml in the app and looks for latest.yml (Windows),
# latest-linux.yml and latest-mac.yml there. desktop-latest always holds the newest build, and the release workflow
# uploads those files to it after the installers they describe. Builds use --publish never: the workflow publishes.
publish:
  provider: generic
  url: https://github.com/freeappstore-online/platform/releases/download/desktop-latest
