# XcodeGen spec: the source of truth for FreeAppStore.xcodeproj. Regenerate with `xcodegen generate`.
name: FreeAppStore
options:
  createIntermediateGroups: true
  # Explicit so the generated LastUpgradeCheck does not follow XcodeGen's default (2.47 changed it).
  xcodeVersion: "16.0"
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  FreeAppStore:
    type: application
    platform: iOS
    sources: [FreeAppStore]
    dependencies:
      # Contribute (#733): Kokoro through sherpa-onnx, fetched by the scheme's build pre-action; libbz2 unpacks the model.
      - framework: Vendor/SherpaOnnxC.xcframework
        embed: true
      - sdk: libbz2.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FAS_BUNDLE_ID)
        INFOPLIST_FILE: FreeAppStore/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: FreeAppStore/FreeAppStore-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
  FreeAppStoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FreeAppStoreTests]
    dependencies:
      - target: FreeAppStore
      - sdk: libbz2.tbd # builds the test archives
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FAS_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  FreeAppStore:
    build:
      targets:
        FreeAppStore: all
        FreeAppStoreTests: [test]
      # Before the build is planned, so the xcframework exists when Xcode looks for it. It checks the pinned SHA-256.
      preActions:
        - name: Fetch sherpa-onnx
          script: '"$SRCROOT/scripts/fetch-sherpa-onnx.sh"'
          settingsTarget: FreeAppStore
        - name: Record the commit
          script: '"$SRCROOT/scripts/write-commit.sh"'
          settingsTarget: FreeAppStore
    test:
      targets: [FreeAppStoreTests]
