name: Fleet consistency audit

# Read-only. Compares the org's repos, the storefront registry, the live sites,
# the platform database (via GET /v1/audit/apps) and each repo's own files
# (#552). It never writes to a repo, the registry or D1; its only write is the
# tracking issue below.
#
# No stored credential: the job mints a GitHub Actions OIDC token for the
# audience freeappstore-fleet-audit, and the API accepts it only from this
# workflow on main (see ops/ACCESS.md). The only secret used is github.token.
#
# Green when the fleet is consistent. On findings it opens or updates ONE issue
# labelled `verification`, then fails the run so the drift is visible; when a
# later run is clean it comments and closes that issue.

on:
  schedule:
    - cron: '41 4 * * *' # daily, offset from the other monitors
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write # mint the OIDC token for the audit API; grants no repo access

concurrency:
  group: fleet-consistency-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Authenticate to the audit API (OIDC)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const token = await core.getIDToken('freeappstore-fleet-audit')
            core.setSecret(token)
            const res = await fetch('https://api.freeappstore.online/v1/audit/apps', {
              headers: { Authorization: `Bearer ${token}` },
            })
            if (!res.ok) {
              const { code } = await res.json().catch(() => ({}))
              core.setFailed(`audit API refused the OIDC token: HTTP ${res.status} ${code ?? ''}`)
              return
            }
            core.exportVariable('FAS_AUDIT_OIDC_TOKEN', token)

      - name: Audit the fleet
        id: audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          node scripts/fleet-consistency-audit.mjs --report "$RUNNER_TEMP/report.md"
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open, update or close the tracking issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AUDIT_CODE: ${{ steps.audit.outputs.code }}
        with:
          script: |
            const fs = require('node:fs')
            const title = 'Fleet consistency audit findings'
            const label = 'verification'
            const code = process.env.AUDIT_CODE
            const { owner, repo } = context.repo
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, labels: label, state: 'open', per_page: 100,
            })
            const existing = open.find((issue) => issue.title === title)

            if (code === '0') {
              if (existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: `Clean as of ${runUrl}. Closing.` })
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' })
              }
              return
            }
            if (code !== '1') core.setFailed(`The audit itself failed (exit ${code}); see ${runUrl}`)
            if (code !== '1') return

            const report = fs.readFileSync(`${process.env.RUNNER_TEMP}/report.md`, 'utf8')
            const body = `${report}\nRun: ${runUrl}\n\nRead-only audit (\`scripts/fleet-consistency-audit.mjs\`). This issue is updated by each run and closed when the fleet is clean.`
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body })
            } else {
              await github.rest.issues.create({ owner, repo, title, labels: [label], body })
            }
            core.setFailed('Fleet consistency findings; see the tracking issue.')
