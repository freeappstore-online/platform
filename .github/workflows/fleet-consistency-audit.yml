name: Fleet consistency audit

# Read-only. Compares the org's repos, the storefront registry, the live sites,
# the platform database (via the admin API, when FAS_AUDIT_ADMIN_TOKEN is set)
# and each repo's own files (#552). It never writes to a repo, the registry or
# D1; its only write is the tracking issue below.
#
# Green when the fleet is consistent. On findings it opens or updates ONE issue
# labelled `verification`, then fails the run so the drift is visible; when a
# later run is clean it comments and closes that issue.

on:
  schedule:
    - cron: '41 4 * * *' # daily, offset from the other monitors
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: fleet-consistency-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Audit the fleet
        id: audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Optional. Without it the apps/routes (D1) checks are skipped and the report says so.
          FAS_AUDIT_ADMIN_TOKEN: ${{ secrets.FAS_AUDIT_ADMIN_TOKEN }}
        run: |
          set +e
          node scripts/fleet-consistency-audit.mjs --report "$RUNNER_TEMP/report.md"
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open, update or close the tracking issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          AUDIT_CODE: ${{ steps.audit.outputs.code }}
        with:
          script: |
            const fs = require('node:fs')
            const title = 'Fleet consistency audit findings'
            const label = 'verification'
            const code = process.env.AUDIT_CODE
            const { owner, repo } = context.repo
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, labels: label, state: 'open', per_page: 100,
            })
            const existing = open.find((issue) => issue.title === title)

            if (code === '0') {
              if (existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: `Clean as of ${runUrl}. Closing.` })
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' })
              }
              return
            }
            if (code !== '1') core.setFailed(`The audit itself failed (exit ${code}); see ${runUrl}`)
            if (code !== '1') return

            const report = fs.readFileSync(`${process.env.RUNNER_TEMP}/report.md`, 'utf8')
            const body = `${report}\nRun: ${runUrl}\n\nRead-only audit (\`scripts/fleet-consistency-audit.mjs\`). This issue is updated by each run and closed when the fleet is clean.`
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body })
            } else {
              await github.rest.issues.create({ owner, repo, title, labels: [label], body })
            }
            core.setFailed('Fleet consistency findings; see the tracking issue.')
