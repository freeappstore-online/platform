name: Desktop

# Lint, typecheck, unit tests, the Electron e2e suite and a packaged-app check for the desktop app (desktop/, #797).
# No release or signing here (#799). desktop-release.yml calls this workflow on the release tag and publishes only
# when every job here passed (#851).
#
# Coverage: check and e2e on Linux x64 (Electron from source under xvfb; the network-dependent Store and What's new
# tests and the real-model Contribute test are left to local runs, desktop/README.md, Test); package on macOS
# (x64 + arm64 packed, arm64 run), Windows x64 and Linux x64 (the packaged app loads its asar-unpacked native addon).
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_call:
    inputs:
      ref:
        description: The ref to test, e.g. refs/tags/desktop-v0.4.1
        type: string
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.30.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.30.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Ubuntu 24.04's AppArmor blocks the unprivileged user namespaces Chromium's sandbox needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm build
      - run: xvfb-run -a pnpm exec playwright test --grep-invert "needs the network" --reporter=list,html
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-e2e
          path: |
            desktop/playwright-report/
            desktop/test-results/

  # Each platform's app packs Contribute's native TTS (#837): sherpa-onnx-node's addon for that OS and CPU, unpacked
  # from the archive, loads in the packaged Electron. No installers, signing or release here.
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac --x64 --arm64
          - os: windows-latest
            target: --win --x64
          - os: ubuntu-latest
            target: --linux --x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.30.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec electron-builder ${{ matrix.target }} --dir --publish never
      - name: The packaged app loads its own sherpa-onnx addon
        run: |
          case "$RUNNER_OS" in
            macOS)   dirs="release/mac-arm64/FreeAppStore.app/Contents/Resources release/mac/FreeAppStore.app/Contents/Resources"
                     app=release/mac-arm64/FreeAppStore.app/Contents/MacOS/FreeAppStore ;;
            Windows) dirs=release/win-unpacked/resources; app=release/win-unpacked/FreeAppStore.exe ;;
            Linux)   dirs=release/linux-unpacked/resources
                     app=$(find release/linux-unpacked -maxdepth 1 -type f -name 'freeappstore*' | head -1) ;;
          esac
          for d in $dirs; do echo "$d:"; ls "$d/app.asar.unpacked/node_modules"; done
          res=${dirs%% *}
          ELECTRON_RUN_AS_NODE=1 "$app" -e "
            const s = require(require('path').resolve(process.argv[1], 'app.asar/node_modules/sherpa-onnx-node'));
            if (typeof s.OfflineTts !== 'function') throw new Error('no OfflineTts');
            console.log('sherpa-onnx', s.version, process.platform, process.arch);" "$res"
