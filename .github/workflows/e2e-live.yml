name: E2E (live)

# Playwright tests against live freeappstore.online + freegamestore.online
# + a few key apps. Catches regressions that unit tests can't see —
# real fullscreen API behavior, real fonts loading, real iframe timing,
# storefront-template drift after registry edits.
#
# Schedule: every 6h, matches the storefront's own cache-refresh cron
# so a stale build can fail loudly instead of being noticed by a user.
# Also fires on push to main when packages/e2e/ changes (so test edits
# get exercised before the next scheduled run).

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/e2e/**'
      - '.github/workflows/e2e-live.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # auditor-fixture.spec.ts injects the LOCAL @freeappstore/quality reporter
      # (packages/quality/dist/index.js) into the page instead of pulling it
      # from esm.sh at runtime. dist/ is gitignored, so build it here.
      - name: Build quality reporter (injected by auditor-fixture spec)
        run: pnpm --filter @freeappstore/quality build

      - name: Install Playwright browsers
        working-directory: packages/e2e
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run e2e tests (default — fixture host = freegamestore.online)
        working-directory: packages/e2e
        run: pnpm test

      # The auditor-fixture spec is parameterised by FAS_FIXTURE_BASE.
      # Run it a second time against the freeappstore deploy so both
      # storefronts' fixtures are exercised by the same cron. The full
      # suite ran above; this re-runs only the fixture spec, ~30s.
      - name: Run auditor-fixture against freeappstore.online
        if: success() || failure()  # run even if step above failed — independent signal
        working-directory: packages/e2e
        env:
          FAS_FIXTURE_BASE: https://freeappstore.online/audit-fixture
        run: pnpm exec playwright test tests/auditor-fixture.spec.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: packages/e2e/playwright-report/
          retention-days: 7
