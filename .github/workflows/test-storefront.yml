name: Test storefront

on:
  pull_request:
    paths:
      - 'sites/storefront/**'
  push:
    branches: [main]
    paths:
      - 'sites/storefront/**'

permissions:
  contents: read

concurrency:
  group: test-storefront-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/storefront
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Design system lint
        run: bash scripts/check-design-system.sh .
      - run: npm test
