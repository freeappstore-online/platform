name: Deploy storefront

on:
  push:
    branches: [main]
    paths:
      - 'sites/storefront/**'
      - 'config/monitoring-fixtures.json'
      - '.github/workflows/deploy-storefront.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-storefront-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/storefront
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The storefront has no runtime deps; the lockfile exists to pin wrangler
      # (exact devDependency) so the deploy step never runs an unpinned npx
      # package with CLOUDFLARE_API_TOKEN in its env (#501). --ignore-workspace:
      # sites/storefront is not a root workspace member.
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - run: npm test
      - run: node build.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/verify-seo.cjs dist
      - run: pnpm exec wrangler pages deploy dist --project-name=freeappstore
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c1089bfcc43c1c6c2aa89e584e86f0bc
