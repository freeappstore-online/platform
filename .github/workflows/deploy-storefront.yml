name: Deploy storefront

on:
  push:
    branches: [main]
    paths:
      - 'sites/storefront/**'
      - 'config/monitoring-fixtures.json'
      - '.github/workflows/deploy-storefront.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-storefront-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/storefront
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # The storefront has no runtime deps; the lockfile exists to pin wrangler
      # (exact devDependency) so the deploy step never runs an unpinned npx
      # package with CLOUDFLARE_API_TOKEN in its env (#501). --ignore-workspace:
      # sites/storefront is not a root workspace member.
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - run: npm test
      - run: node build.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/verify-seo.cjs dist
      - run: pnpm exec wrangler pages deploy dist --project-name=freeappstore
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c1089bfcc43c1c6c2aa89e584e86f0bc
