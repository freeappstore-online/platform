name: Deploy host

# Deploys the freeappstore-host Worker (Path B R2 hosting) on pushes that
# touch workers/host. Consolidated from the former freeappstore-online/host
# repo (2026-06-02). Reuses the repo's CLOUDFLARE_API_TOKEN (same CF account).

on:
  push:
    branches: [main]
    paths:
      - 'workers/host/**'
      - 'config/monitoring-fixtures.json'
      - '.github/workflows/deploy-host.yml'
      - 'scripts/verify-app-host.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-host
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests
        run: pnpm test

      # The real Worker in workerd with real D1/R2/Durable Objects and stub
      # service bindings (#7): the wiring the unit tests mock.
      - name: Runtime integration tests
        run: pnpm test:runtime

      # Migrations first. wrangler deploy does not apply D1 migrations, and
      # this Worker selects routes.cross_origin_isolated on every app request.
      # Shipping the Worker before 0002 made every hosted app throw (#308).
      - name: Apply D1 migrations
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if pnpm exec wrangler d1 migrations apply fas --remote; then
              exit 0
            fi
            echo "migration attempt ${attempt} failed; retrying"
            sleep 5
          done
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # A successful upload is not recovery. This hits the live host: every
      # public app root, representative JS assets, the console, an unknown
      # host's 404, API health, and default-off COOP/COEP.
      - name: Verify live app host
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if node scripts/verify-app-host.mjs; then
              exit 0
            fi
            echo "live app-host check attempt ${attempt} failed; retrying"
            sleep 10
          done
          exit 1
