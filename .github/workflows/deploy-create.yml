name: Deploy create

# Deploys the onboarding/scaffold site to R2 (served at console.freeappstore.online/create
# via the host Worker's routes table). Folded from the former
# freeappstore-online/create repo (2026-06-30, see PLAN-CONSOLIDATE-PLATFORM.md).
#
# Same caveats as deploy-console.yml: R2 prefix HARDCODED to apps/create/ (G2),
# nested pnpm workspace handled via working-directory (G3), needs R2 S3 secrets (G4).
# Dispatch-only until secrets are provisioned + verified; then archive
# freeappstore-online/create and enable the push trigger below.

on:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'sites/create/**'
  #     - '.github/workflows/deploy-create.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-create
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/create
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify build output
        run: |
          test -d ./web/dist || { echo "::error::No build output at web/dist"; exit 1; }
          test -n "$(ls -A ./web/dist)" || { echo "::error::web/dist is empty"; exit 1; }

      - name: Upload to R2 (prefix apps/create — must match the host routes table)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          aws s3 sync ./web/dist "s3://fas-apps/apps/create/" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --delete \
            --no-progress
          echo "Deployed apps/create from ${GITHUB_SHA::7}"
