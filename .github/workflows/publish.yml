name: Publish to npm

# Triggers on any push to main that touches the publishable packages.
# Auto-bumps patch version when changes exist but no manual bump was made.
# Manual bumps (minor/major) are respected — auto-bump only kicks in
# when local version == npm version and the package has changes in this push.
#
# Auth: OIDC trusted publishing — no stored NPM_TOKEN needed.
# Each @freeappstore/* package is linked to this repo on npmjs.com.

on:
  push:
    branches: [main]
    paths:
      - 'packages/cli/**'
      - 'packages/sdk/**'
      - 'packages/compliance/**'
      - 'packages/quality/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch: # manual trigger — publishes all packages

permissions:
  contents: write # push version bumps back to main
  id-token: write # OIDC token for npm trusted publishing + provenance

jobs:
  publish:
    outputs:
      versions: ${{ steps.publish.outputs.versions }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build ALL packages — cli depends on compliance + sdk.
      - name: Build all packages
        run: pnpm -r --filter './packages/*' build

      - name: Publish packages
        id: publish
        run: |
          BUMPED=""
          FAILED=""
          BEFORE="${{ github.event.before }}"

          # Keep in-source version constants in lockstep with package.json so
          # version.test.ts can't drift on release (the SDK telemetry version in
          # logger.ts used to fall behind every auto-bump and red the deploy).
          sync_source_version() {
            if [ "$1" = "sdk" ]; then
              node -e "
                const fs=require('fs'); const p='packages/sdk/src/logger.ts';
                const s=fs.readFileSync(p,'utf8').replace(
                  /(export const SDK_VERSION = ')[^']*(';)/, '\$1$2\$2');
                fs.writeFileSync(p,s);
              "
              echo "synced logger.ts SDK_VERSION → $2"
            fi
          }

          # pnpm pins workspace dependencies at pack time: publish dependencies first.
          for PKG in sdk compliance quality cli; do
            PKG_NAME=$(node -p "require('./packages/$PKG/package.json').name")
            LOCAL_VER=$(node -p "require('./packages/$PKG/package.json').version")
            NPM_VER=$(npm view "$PKG_NAME" version 2>/dev/null || echo "0.0.0")

            # Compare versions (is local ahead of npm?)
            IS_AHEAD=$(node -e "
              const [a,b] = ['$LOCAL_VER','$NPM_VER'].map(v => v.split('.').map(Number));
              const ahead = a[0]>b[0] || (a[0]===b[0] && (a[1]>b[1] || (a[1]===b[1] && a[2]>b[2])));
              console.log(ahead ? 'true' : 'false');
            ")

            if [ "$LOCAL_VER" != "$NPM_VER" ] && [ "$IS_AHEAD" = "true" ]; then
              # Manual bump — publish as-is
              echo "::group::$PKG_NAME: manual bump $NPM_VER → $LOCAL_VER"
              if (cd packages/$PKG && pnpm publish --access public --provenance --no-git-checks); then
                echo "Published $PKG_NAME@$LOCAL_VER"
              else
                FAILED="$FAILED $PKG_NAME"
              fi
              echo "::endgroup::"

            elif [ "$LOCAL_VER" != "$NPM_VER" ] && [ "$IS_AHEAD" = "false" ]; then
              # Local is behind npm (missed bump commit) — heal by syncing local to npm
              echo "$PKG_NAME: healing $LOCAL_VER → $NPM_VER (syncing to npm)"
              node -e "
                const fs = require('fs');
                const pkg = JSON.parse(fs.readFileSync('./packages/$PKG/package.json', 'utf8'));
                pkg.version = '$NPM_VER';
                fs.writeFileSync('./packages/$PKG/package.json', JSON.stringify(pkg, null, 2) + '\n');
              "
              sync_source_version "$PKG" "$NPM_VER"
              BUMPED="$BUMPED $PKG_NAME@$NPM_VER"

            else
              # Version matches npm — auto-bump only if this package has changes
              HAS_CHANGES=true
              if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
                if git diff --quiet "$BEFORE" HEAD -- "packages/$PKG/"; then
                  HAS_CHANGES=false
                fi
              fi

              if [ "$HAS_CHANGES" = "true" ]; then
                IFS='.' read -r MAJOR MINOR PATCH <<< "$LOCAL_VER"
                NEW_VER="$MAJOR.$MINOR.$((PATCH + 1))"
                echo "::group::$PKG_NAME: auto-bump $LOCAL_VER → $NEW_VER"
                node -e "
                  const fs = require('fs');
                  const pkg = JSON.parse(fs.readFileSync('./packages/$PKG/package.json', 'utf8'));
                  pkg.version = '$NEW_VER';
                  fs.writeFileSync('./packages/$PKG/package.json', JSON.stringify(pkg, null, 2) + '\n');
                "
                sync_source_version "$PKG" "$NEW_VER"
                if (cd packages/$PKG && pnpm publish --access public --provenance --no-git-checks); then
                  echo "Published $PKG_NAME@$NEW_VER"
                  BUMPED="$BUMPED $PKG_NAME@$NEW_VER"
                else
                  FAILED="$FAILED $PKG_NAME"
                fi
                echo "::endgroup::"
              else
                echo "$PKG_NAME: no changes, skipping"
              fi
            fi
          done

          echo "bumped=$BUMPED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          SDK_VERSION=$(node -p "require('./packages/sdk/package.json').version")
          CLI_VERSION=$(node -p "require('./packages/cli/package.json').version")
          echo "versions=@freeappstore/sdk@$SDK_VERSION @freeappstore/cli@$CLI_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bumps
        if: steps.publish.outputs.bumped != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/*/package.json packages/sdk/src/logger.ts
          git commit -m "chore: auto-bump published versions [skip ci]"
          git pull --rebase origin main
          git push

      - name: Report failures
        if: steps.publish.outputs.failed != ''
        run: |
          echo "::error::Failed to publish:${{ steps.publish.outputs.failed }}"
          exit 1

  published-capability-scaffold:
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - template: connected
            preset: persistence
          - template: connected
            preset: backup
          - template: standalone
            preset: persistence
          - template: standalone
            preset: backup
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Configure scaffold commit identity
        run: |
          git config --global user.email "published-scaffold@freeappstore.online"
          git config --global user.name "Published Scaffold Smoke"

      - name: Select this publish run's CLI and SDK versions
        env:
          PUBLISHED_PACKAGES: ${{ needs.publish.outputs.versions }}
        run: |
          set -euo pipefail
          CLI_VERSION="$(printf '%s\n' "$PUBLISHED_PACKAGES" | grep -oE '@freeappstore/cli@[0-9]+\.[0-9]+\.[0-9]+' | cut -d@ -f3)"
          SDK_VERSION="$(printf '%s\n' "$PUBLISHED_PACKAGES" | grep -oE '@freeappstore/sdk@[0-9]+\.[0-9]+\.[0-9]+' | cut -d@ -f3)"
          test -n "$CLI_VERSION"
          test -n "$SDK_VERSION"
          test "$(npm view "@freeappstore/cli@$CLI_VERSION" version)" = "$CLI_VERSION"
          test "$(npm view "@freeappstore/sdk@$SDK_VERSION" version)" = "$SDK_VERSION"
          echo "CLI_VERSION=$CLI_VERSION" >> "$GITHUB_ENV"
          echo "SDK_VERSION=$SDK_VERSION" >> "$GITHUB_ENV"
          echo "Validating @freeappstore/cli@$CLI_VERSION against @freeappstore/sdk@$SDK_VERSION"

      - name: Initialize from the published CLI and current template
        run: |
          set -euo pipefail
          mkdir -p /tmp/published-capability-scaffold
          cd /tmp/published-capability-scaffold
          APP_ID="smoke-${{ matrix.template }}-${{ matrix.preset }}"
          npx --yes "@freeappstore/cli@$CLI_VERSION" init "$APP_ID" \
            --template="${{ matrix.template }}" --preset "${{ matrix.preset }}"
          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"

      - name: Install published SDK dependencies
        working-directory: /tmp/published-capability-scaffold
        run: |
          set -euo pipefail
          cd "$APP_ID"
          # Pin this run's SDK release in both packages so a later registry
          # publication cannot change what this smoke test actually verifies.
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            for (const path of ["package.json", "web/package.json"]) {
              const pkg = JSON.parse(readFileSync(path, "utf8"));
              for (const section of ["dependencies", "devDependencies"]) {
                if (pkg[section]?.["@freeappstore/sdk"]) {
                  pkg[section]["@freeappstore/sdk"] = process.env.SDK_VERSION;
                }
              }
              writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
            }
          '
          pnpm install --no-frozen-lockfile

      - name: Compile generated capability imports against the published SDK
        working-directory: /tmp/published-capability-scaffold
        run: |
          set -euo pipefail
          cd "$APP_ID"
          if [ "${{ matrix.preset }}" = "backup" ]; then
            ENTRYPOINT=fas-capabilities/backup.ts
          else
            ENTRYPOINT=fas-capabilities/persistence.ts
          fi
          pnpm --package=typescript@5.9.3 dlx tsc --noEmit --skipLibCheck \
            --target ES2022 --module NodeNext --moduleResolution NodeNext \
            "$ENTRYPOINT"
