name: Desktop release

# Unsigned installers for the desktop app (desktop/, #805): macOS dmg + zip (x64, arm64; ad-hoc signed),
# Windows NSIS exe, Linux AppImage. Signing, notarization and auto-update need credentials: #799.
#
# Each run publishes a versioned release `desktop-v<version>` and refreshes the fixed release `desktop-latest`,
# whose download URLs never change:
#   https://github.com/freeappstore-online/platform/releases/download/desktop-latest/<asset>
# The download page (sites/storefront/download.html) links there, so it keeps working whatever other releases this
# repo gets later.
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.1.0 (creates tag desktop-v<version> on this commit if missing)'
        required: true

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then version="$INPUT_VERSION"; else version="${GITHUB_REF_NAME#desktop-v}"; fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Not a semver version: $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=desktop-v$version" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG exists; building it."
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
            echo "Created tag $TAG at $GITHUB_SHA."
          fi

  build:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      # No certificates anywhere: never look for a signing identity, never notarize.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.30.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: npm pkg set version=${{ needs.tag.outputs.version }}
      - run: pnpm build
      - run: pnpm exec electron-builder ${{ matrix.target }} --publish never
      - name: Collect installers
        run: |
          mkdir -p ../out
          for f in release/FreeAppStore-*.{dmg,zip,exe,AppImage}; do [ -e "$f" ] && cp "$f" ../out/; done
          ls -l ../out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  release:
    needs: [tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.tag.outputs.tag }}
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: out
          merge-multiple: true
      - name: Check the asset names the download page links to
        run: |
          ls -l out
          for f in FreeAppStore-mac-x64.dmg FreeAppStore-mac-arm64.dmg FreeAppStore-mac-x64.zip FreeAppStore-mac-arm64.zip \
                   FreeAppStore-win-x64.exe FreeAppStore-linux-x86_64.AppImage; do
            [ -s "out/$f" ] || { echo "::error::Missing $f"; exit 1; }
          done
      - name: Publish desktop-v${{ needs.tag.outputs.version }}
        run: |
          notes="FreeAppStore desktop $VERSION, a preview build. Unsigned: see https://freeappstore.online/download for first-launch steps."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --verify-tag --title "FreeAppStore desktop $VERSION" --notes "$notes" --latest
          fi
      - name: Refresh desktop-latest
        run: |
          notes="Always the newest FreeAppStore desktop build (currently $VERSION, from $TAG). Unsigned preview: see https://freeappstore.online/download for first-launch steps."
          if gh release view desktop-latest >/dev/null 2>&1; then
            gh release upload desktop-latest out/* --clobber
            gh release edit desktop-latest --notes "$notes" --latest=false
          else
            gh release create desktop-latest out/* --target "$GITHUB_SHA" --title "FreeAppStore desktop (latest)" --notes "$notes" --latest=false
          fi
