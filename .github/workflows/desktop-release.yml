name: Desktop release

# Signed public installers (#857): Developer ID + notarization for macOS, Authenticode for Windows,
# GitHub signed provenance for every installer including Linux. Missing credentials fail before tagging.
#
# Updates (#839): each build also writes its update file (latest.yml, latest-linux.yml, latest-mac.yml), and the
# installed apps look for them on desktop-latest (desktop/electron-builder.yml `publish`). They are uploaded there
# after the installers, so an app never reads a version whose installer isn't up yet. The release notes, which the
# app's What's new page shows, are the desktop's commits since the previous desktop tag (scripts/app-release.sh).
#
# The version is desktop/package.json (#832, docs/versioning.md). Run this workflow with a version: it writes that
# version to desktop/package.json on main (scripts/app-release.sh cut), tags the commit desktop-v<version> and builds
# the tag. A pushed tag desktop-v<version> builds as long as it matches the package.json at that tag.
#
# Nothing is published unless desktop.yml (lint, typecheck, unit tests, Electron e2e, packaged apps) passes on the
# tag being released (#851): the release job needs the test job, so a failed or cancelled check skips it.
#
# Each run publishes a versioned release `desktop-v<version>` and refreshes the fixed release `desktop-latest`,
# whose download URLs never change:
#   https://github.com/freeappstore-online/platform/releases/download/desktop-latest/<asset>
# The download page resolves complete versioned releases at build time and links to the exact installers shown.
# desktop-latest remains its fallback if metadata is unavailable, and the installed apps' update channel.
# deploy-storefront.yml rebuilds the page after this workflow succeeds.
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.3.0: written to desktop/package.json on main and tagged desktop-v<version> (an existing tag is rebuilt)'
        required: true

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  tag:
    # Cloud-managed Xcode signing uses desktop-cloud-release.yml instead of an exportable private key.
    if: github.event_name == 'workflow_dispatch' || vars.DESKTOP_CERTIFICATE_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      matrix: ${{ steps.signing.outputs.matrix }}
    steps:
      - name: Require signing configuration before creating a release tag
        id: signing
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WINDOWS_SIGNING_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_THUMBPRINT }}
          WINDOWS_DIRECT: ${{ vars.DESKTOP_WINDOWS_DIRECT_ENABLED }}
        run: |
          for key in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD ASC_API_KEY_P8_BASE64 ASC_API_KEY_ID ASC_API_ISSUER_ID APPLE_TEAM_ID; do
            [ -n "${!key}" ] || { echo "::error::Missing signing configuration: $key (see docs/native-security-audit.md)"; exit 1; }
          done
          if [ "$WINDOWS_DIRECT" = true ]; then
            for key in WIN_CSC_LINK WIN_CSC_KEY_PASSWORD WINDOWS_SIGNING_THUMBPRINT; do
              [ -n "${!key}" ] || { echo "::error::Direct Windows release enabled but missing $key"; exit 1; }
            done
            echo 'matrix={"include":[{"os":"macos-latest","target":"--mac"},{"os":"ubuntu-latest","target":"--linux"},{"os":"windows-latest","target":"--win"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"os":"macos-latest","target":"--mac"},{"os":"ubuntu-latest","target":"--linux"}]}' >> "$GITHUB_OUTPUT"
          fi
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then version="$INPUT_VERSION"; else version="${GITHUB_REF_NAME#desktop-v}"; fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Not a semver version: $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=desktop-v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 0
      # An existing tag is built again as it is; a new version is written to main and tagged.
      - if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then git checkout -q "$TAG"
          else bash scripts/app-release.sh cut desktop "${{ steps.v.outputs.version }}"; fi
      - name: desktop/package.json matches the tag
        run: |
          committed=$(bash scripts/app-release.sh version desktop)
          [ "$committed" = "${{ steps.v.outputs.version }}" ] || { echo "::error::desktop/package.json is $committed at this tag"; exit 1; }

  test:
    needs: tag
    uses: ./.github/workflows/desktop.yml
    with:
      ref: refs/tags/${{ needs.tag.outputs.tag }}

  build:
    needs: tag
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.tag.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.30.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # The build number the app shows next to its version (scripts/build-info.mjs); without it a build says "dev".
      - run: pnpm build
        env:
          FAS_BUILD_NUMBER: ${{ github.run_number }}
      - name: Build signed installers
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_BASE64: ${{ runner.os == 'macOS' && secrets.ASC_API_KEY_P8_BASE64 || '' }}
          APPLE_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          if [ "$RUNNER_OS" = macOS ]; then
            export APPLE_API_KEY="$RUNNER_TEMP/notary-key.p8"
            trap 'rm -f "$APPLE_API_KEY"' EXIT
            printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$APPLE_API_KEY"
          fi
          pnpm exec electron-builder ${{ matrix.target }} --config electron-builder.release.yml --publish never
          if [ "$RUNNER_OS" = macOS ]; then bash scripts/verify-mac-release.sh; fi
      - name: Verify Windows application and installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGNING_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_THUMBPRINT }}
        run: ./scripts/verify-windows-release.ps1
      - name: Collect installers
        run: |
          mkdir -p ../out
          for f in release/FreeAppStore-*.{dmg,zip,exe,AppImage} release/latest*.yml; do [ -e "$f" ] && cp "$f" ../out/; done
          for f in release/*-signing-verification.json; do [ ! -e "$f" ] || cp "$f" ../out/; done
          ls -l ../out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  release:
    needs: [tag, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.tag.outputs.tag }}
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        # Only the installers: the test job's e2e report (desktop-e2e) is an artifact of this run too
        with:
          path: out
          pattern: installers-*
          merge-multiple: true
      - name: Check the asset names the download page links to
        run: |
          ls -l out
          for f in FreeAppStore-mac-x64.dmg FreeAppStore-mac-arm64.dmg FreeAppStore-mac-x64.zip FreeAppStore-mac-arm64.zip \
                   FreeAppStore-linux-x86_64.AppImage latest-linux.yml latest-mac.yml; do
            [ -s "out/$f" ] || { echo "::error::Missing $f"; exit 1; }
          done
          if [ -e out/FreeAppStore-win-x64.exe ]; then
            [ -s out/latest.yml ] && [ -s out/windows-signing-verification.json ] || { echo '::error::Missing Windows updater/signing evidence'; exit 1; }
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Bind verified signing evidence to the final installer hashes
        run: node desktop/scripts/write-signing-manifest.mjs out "$VERSION" "$TAG" "$(git rev-parse HEAD)"
      - name: Sign build provenance for the installers (including Linux)
        id: provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: out/FreeAppStore-*
      - name: Include the signature bundle with the downloads
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" out/FreeAppStore-provenance.sigstore.json
      - name: Publish desktop-v${{ needs.tag.outputs.version }}
        run: |
          { echo "FreeAppStore desktop $VERSION. Notarized macOS installers and Linux AppImage; signed build provenance is included."
            if [ -e out/FreeAppStore-win-x64.exe ]; then echo 'An Authenticode-signed Windows installer is included. SmartScreen readiness is tracked separately in the signing manifest.'
            else echo 'Windows distribution is prepared separately through Microsoft Store.'; fi
            echo; bash scripts/app-release.sh notes desktop "$TAG"; } > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" out/* --verify-tag --title "FreeAppStore desktop $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest
          fi
      - name: Refresh desktop-latest
        run: |
          notes="Current Mac/Linux release: $VERSION, from $TAG. Notarized macOS installers and signed provenance. Consult the versioned release signing manifest for platform eligibility; Windows Store distribution is separate."
          if gh release view desktop-latest >/dev/null 2>&1; then
            gh release upload desktop-latest out/FreeAppStore-* --clobber
            gh release edit desktop-latest --notes "$notes" --latest=false
          else
            gh release create desktop-latest out/FreeAppStore-* --target "$GITHUB_SHA" --title "FreeAppStore desktop (latest)" --notes "$notes" --latest=false
          fi
          # Last: the update files that point installed apps at the installers above.
          gh release upload desktop-latest out/latest*.yml --clobber
