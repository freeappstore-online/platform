name: Deploy admin

# Deploys the freeappstore-admin Worker (privileged provisioning + admin SPA)
# on pushes that touch workers/admin. Consolidated from the former
# freeappstore-online/admin repo (2026-06-02).
#
# admin/ and admin/web/ are two independent pnpm projects (each its own
# lockfile), so installs use --ignore-workspace to bypass this monorepo's
# root pnpm workspace. The web SPA builds into workers/admin/public, which
# wrangler serves via its `assets` binding.
#
# Note: the former repo also ran a post-deploy CF Access smoke using
# ADMIN_CF_ACCESS_CLIENT_ID/SECRET. That step is omitted here; re-add it if
# those secrets are provisioned on this repo.

on:
  push:
    branches: [main]
    paths:
      - 'workers/admin/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-admin
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install (worker)
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Tests
        run: pnpm test

      # The real Worker in workerd with real D1/R2/Durable Objects and stub
      # service bindings (#7): the wiring the unit tests mock.
      - name: Runtime integration tests
        run: pnpm test:runtime

      - name: Build admin SPA → public/
        run: cd web && pnpm install --frozen-lockfile --ignore-workspace && pnpm build

      # Publish writes routes.cross_origin_isolated. Apply the host migrations
      # before this Worker goes out, using the host wrangler config so the
      # routes schema stays with workers/host (#308).
      - name: Apply host D1 migrations
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if pnpm exec wrangler d1 migrations apply fas --remote --config ../host/wrangler.toml; then
              exit 0
            fi
            echo "migration attempt ${attempt} failed; retrying"
            sleep 5
          done
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Runtime Worker secrets are not set here. They live SOPS-encrypted in
      # ~/dev/ops (serge-ivo/ops); `ops put fas <KEY>` stores a value and pushes
      # it to every consumer in inventory.yaml, including this Worker
      # (freeappstore-admin). Re-place one: `ops push fas <KEY> wrangler freeappstore-admin`.

      - name: Deploy
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
