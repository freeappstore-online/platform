name: Deploy mcp

# Deploys the freeappstore-mcp Worker (mcp.freeappstore.online) — MCP server.
# Folded from the former freeappstore-online/mcp repo (2026-06-30, see
# PLAN-CONSOLIDATE-PLATFORM.md).
#
# A self-contained pnpm project like the other Workers (own lockfile and
# pnpm-workspace.yaml root marker; see workers/README.md). Worker name `freeappstore-mcp` is unchanged, so the Durable Object namespace
# (FasMcpAgent) and its applied migrations carry over (G5).
#
# Changes to workers/mcp on main deploy automatically from this monorepo.
# workflow_dispatch supports explicit redeployment of the same source.

on:
  push:
    branches: [main]
    paths:
      - 'workers/mcp/**'
      # Shared source the worker bundles (#667): app-id rules, compliance
      # preflight, and the starter scaffold (incl. the app-deploy.yml pin).
      - 'packages/backend/src/lib/apps.ts'
      - 'packages/backend/src/lib/reserved-app-ids.ts'
      - 'packages/compliance/src/**'
      - 'packages/cli/src/lib/developer-recipes.ts'
      - 'packages/cli/src/lib/capability-definitions.ts'
      - 'packages/cli/src/lib/starter-dependencies.ts'
      - 'packages/cli/src/lib/starter-foundation.ts'
      - 'packages/cli/src/lib/starter-presets.ts'
      - '.github/workflows/deploy-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mcp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm run typecheck

      # Gate the deploy on the worker's own suite, as deploy-admin/agent/host do.
      # Covers the OAuth callback's nonce/state/flow-cookie binding (#44, #61).
      - name: Tests
        run: pnpm test

      - name: Real Worker MCP runtime smoke
        run: pnpm test:runtime

      - name: Deploy
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
