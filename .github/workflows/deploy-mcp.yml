name: Deploy mcp

# Deploys the freeappstore-mcp Worker (mcp.freeappstore.online) — MCP server.
# Folded from the former freeappstore-online/mcp repo (2026-06-30, see
# PLAN-CONSOLIDATE-PLATFORM.md).
#
# NOTE: mcp uses npm (package-lock.json), NOT pnpm like the other Workers (G1).
# Worker name `freeappstore-mcp` is unchanged, so the Durable Object namespace
# (FasMcpAgent) and its applied migrations carry over (G5).
#
# Changes to workers/mcp on main deploy automatically from this monorepo.
# workflow_dispatch supports explicit redeployment of the same source.

on:
  push:
    branches: [main]
    paths:
      - 'workers/mcp/**'
      - 'packages/cli/src/lib/developer-recipes.ts'
      - '.github/workflows/deploy-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mcp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Gate the deploy on the worker's own suite, as deploy-admin/agent/host do.
      # Covers the OAuth callback's nonce/state/flow-cookie binding (#44, #61).
      - name: Tests
        run: npm test

      - name: Real Worker MCP runtime smoke
        run: npm run test:runtime

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
