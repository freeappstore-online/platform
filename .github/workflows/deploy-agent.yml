name: Deploy agent

# Deploys the freeappstore-agent Worker (VibeCode AI builder + Durable Object)
# on pushes that touch workers/agent. Consolidated from the former
# freeappstore-online/agent repo (2026-06-02). wrangler deploy preserves the
# AgentSession Durable Object + its runtime secrets across re-deploys.

on:
  push:
    branches: [main]
    paths:
      - 'workers/agent/**'
      - 'packages/cli/src/lib/developer-recipes.ts'
      # The agent imports the shared Web Push sender from the backend (#146).
      - 'packages/backend/src/lib/web-push.ts'
      # The agent imports the no-payments and no-ads checks from compliance
      # source, so compliance changes alter the deployed Worker even when
      # workers/agent itself doesn't change.
      - 'packages/compliance/**'
      # The worker consumes canonical capability resolution shared with the CLI.
      - 'packages/cli/src/lib/capability-definitions.ts'
      - 'packages/cli/src/lib/starter-presets.ts'
      - 'packages/cli/src/lib/starter-dependencies.ts'
      - 'packages/cli/src/lib/starter-foundation.ts'
      - '.github/workflows/deploy-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-agent
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: pnpm test

      # The real Worker in workerd with real D1/R2/Durable Objects and stub
      # service bindings (#7): the wiring the unit tests mock.
      - name: Runtime integration tests
        run: pnpm test:runtime

      # Shared source must resolve with only this worker's dependencies installed.
      - name: Isolated worker bundle regression
        run: pnpm test:bundle

      - name: Deploy
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
