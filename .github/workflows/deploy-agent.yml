name: Deploy agent

# Deploys the freeappstore-agent Worker (VibeCode AI builder + Durable Object)
# on pushes that touch workers/agent. Consolidated from the former
# freeappstore-online/agent repo (2026-06-02). wrangler deploy preserves the
# AgentSession Durable Object + its runtime secrets across re-deploys.

on:
  push:
    branches: [main]
    paths:
      - 'workers/agent/**'
      - '.github/workflows/deploy-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-agent
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/agent
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: pnpm test

      - name: Deploy
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
