name: App deploy

# The FreeAppStore app deploy (#559). Every app's .github/workflows/deploy.yml
# calls this file at a pinned commit, and api.freeappstore.online accepts an
# upload only from this workflow at a commit it lists. Three jobs on purpose:
#   build  — the app's install/test/build. No id-token: a compromised npm
#            package can only fail the build. Its checks fail fast, but project
#            code runs here, so they cannot vouch for what gets uploaded.
#   verify — checks the artifact that will ship. Reads the repo, never runs it.
#   deploy — uploads that same artifact (by id, so another job in the run
#            cannot swap it) with a GitHub OIDC token. Runs no project code and
#            holds no secret.
# The code-health report comes from the build job, so it is advisory.
# Generated by appDeployWorkflow() in packages/cli/src/lib/starter-foundation.ts;
# edit the generator, not this file.

on:
  workflow_call:
    inputs:
      vars:
        description: The caller's toJSON(vars). VITE_* entries reach the build as environment variables.
        type: string
        default: '{}'
      setup:
        description: Shell run after the dependencies install (extra build tooling).
        type: string
        default: ''
      checks:
        description: Shell run after the build, before the artifact is accepted (lint, e2e).
        type: string
        default: ''
      python-version:
        description: Set up this Python before the install.
        type: string
        default: ''
      code-health:
        description: Run the code-health scan and publish its report.
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      app: ${{ steps.app.outputs.artifact-id }}
      code-health: ${{ steps.health.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Set up Python
        if: ${{ inputs.python-version != '' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install
        run: |
          set -euo pipefail
          if [ ! -f pnpm-lock.yaml ]; then
            echo "Creating the first dependency lock for this app."
            pnpm install --no-frozen-lockfile
          else
            log=$(mktemp)
            if pnpm install --frozen-lockfile >"$log" 2>&1; then
              cat "$log"
            else
              status=$?
              cat "$log"
              if grep -q 'ERR_PNPM_OUTDATED_LOCKFILE' "$log"; then
                echo "::error::pnpm-lock.yaml does not match package.json. Run pnpm install locally and commit the updated lock; deploys never rewrite it."
              fi
              rm "$log"
              exit "$status"
            fi
            rm "$log"
          fi
      # VITE_* public config (OAuth client ids, Firebase config) comes from the
      # repo's Actions Variables. See https://freeappstore.online/skills.md "App Config & Secrets".
      - name: Export public build variables
        env:
          VARS: ${{ inputs.vars }}
        run: |
          printf '%s' "$VARS" | jq -r 'to_entries[] | select(.key | test("^VITE_[A-Z0-9_]+$"))
            | "\(.key)<<FAS_VAR_EOF\n\(.value)\nFAS_VAR_EOF"' >> "$GITHUB_ENV"
      - name: Extra setup
        if: ${{ inputs.setup != '' }}
        env:
          SCRIPT: ${{ inputs.setup }}
        run: bash -e -c "$SCRIPT"
      - name: Resolve build target
        id: target
        run: npx --yes @freeappstore/cli@0.4.79 build-target --app-id "${GITHUB_REPOSITORY##*/}" --github-output
      - name: Typecheck (when configured)
        run: pnpm run --if-present typecheck
      - name: Tests (when configured)
        run: pnpm run --if-present test
      - name: Build
        env:
          BUILD_COMMAND: ${{ steps.target.outputs.build-command }}
          VITE_APP_VERSION: ${{ github.event.repository.name }}@${{ github.run_number }}
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        run: bash -e -c "$BUILD_COMMAND"
      - name: Verify build output
        run: npx --yes @freeappstore/cli@0.4.79 build-target --artifact --app-id "${GITHUB_REPOSITORY##*/}"
      - name: App checks
        if: ${{ inputs.checks != '' }}
        env:
          SCRIPT: ${{ inputs.checks }}
        run: bash -e -c "$SCRIPT"
      # Installed size for the store's detail page (sites/storefront/build.js).
      - name: Write build info
        env:
          OUTPUT_PATH: ${{ steps.target.outputs.output-path }}
        run: echo "{\"size\":$(du -sb "$OUTPUT_PATH" | cut -f1)}" > "$OUTPUT_PATH/.buildinfo.json"
      - name: Retain verified dependency lock
        run: |
          set -euo pipefail
          test -f pnpm-lock.yaml
          git add -- pnpm-lock.yaml
          if ! git diff --cached --quiet -- pnpm-lock.yaml; then
            git config user.name "FreeAppStore dependency lock"
            git config user.email "dependency-lock@freeappstore.online"
            git commit -m "build: retain verified dependency resolution [skip ci]" -- pnpm-lock.yaml
            # A normal push rejects concurrent main changes; never overwrite newer app work.
            git push origin HEAD:main
          fi
          echo "Accepted source: $(git rev-parse HEAD)"
      # Code health scan — the JSON report + badge are published next to the
      # app so the console and store listings can show them. Never blocks.
      - name: Code health scan
        if: ${{ inputs.code-health }}
        run: npx --yes @vibecodeqa/cli@0.57.0 --json --badge > /dev/null 2>&1 || true
      - name: Upload build artifact
        id: app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app
          path: ${{ steps.target.outputs.output-path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Upload code health report
        id: health
        if: ${{ inputs.code-health }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-health
          path: |
            .vibe-check/report.json
            .vibe-check/badge.svg
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1

  verify:
    needs: build
    # Without an id the download would fetch every artifact in the run.
    if: ${{ needs.build.outputs.app != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Outside the checkout: a repo's .npmrc or committed node_modules must
      # not choose the program that checks that repo.
      - name: Install the validator
        working-directory: ${{ runner.temp }}
        run: npm install --prefix fas-validator --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org @freeappstore/cli@0.4.79
      - name: Fast source compliance check
        run: '"$RUNNER_TEMP/fas-validator/node_modules/.bin/fas" check'
      - name: Resolve build target
        id: target
        run: '"$RUNNER_TEMP/fas-validator/node_modules/.bin/fas" build-target --app-id "${GITHUB_REPOSITORY##*/}" --github-output'
      - name: Replace the output path with the artifact
        env:
          OUTPUT_PATH: ${{ steps.target.outputs.output-path }}
        run: rm -rf -- "$OUTPUT_PATH"
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.app }}
          merge-multiple: true
          path: ${{ steps.target.outputs.output-path }}
      - name: Verify build output
        run: '"$RUNNER_TEMP/fas-validator/node_modules/.bin/fas" build-target --artifact --app-id "${GITHUB_REPOSITORY##*/}"'

  deploy:
    needs: [build, verify]
    if: ${{ needs.build.outputs.app != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_API: https://api.freeappstore.online
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.app }}
          merge-multiple: true
          path: site
      - name: Download code health report
        if: ${{ needs.build.outputs.code-health != '' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.code-health }}
          merge-multiple: true
          path: site/.vcqa
      - name: Upload keylessly
        run: |
          set -euo pipefail
          cd site
          test -n "$(ls -A .)" || { echo "::error::build artifact is empty"; exit 1; }
          find . -type f -printf '%P\t%s\n' \
            | jq -Rn '[inputs | split("\t") | {key: .[0], value: (.[1] | tonumber)}] | from_entries' \
            > "$RUNNER_TEMP/sizes.json"
          # Content hashes let the API skip files unchanged since the live release.
          find . -type f -print0 | xargs -0 sha256sum \
            | jq -Rn '[inputs | capture("^(?<h>[0-9a-f]{64})  \\./(?<p>.*)$")] | map({key: .p, value: .h}) | from_entries' \
            > "$RUNNER_TEMP/hashes.json"
          jq -n --slurpfile f "$RUNNER_TEMP/sizes.json" --slurpfile h "$RUNNER_TEMP/hashes.json" \
            '{files: $f[0], hashes: $h[0]}' > "$RUNNER_TEMP/manifest.json"
          oidc=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$DEPLOY_API" | jq -r .value)
          echo "::add-mask::$oidc"
          session=$(curl -sS --fail-with-body -X POST "$DEPLOY_API/v1/deploys" \
            -H "Authorization: Bearer $oidc" -H 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/manifest.json") \
            || { echo "::error::deploy refused: $session"; exit 1; }
          printf '%s' "$session" > "$RUNNER_TEMP/session.json"
          DEPLOY_TOKEN=$(jq -r .token "$RUNNER_TEMP/session.json")
          echo "::add-mask::$DEPLOY_TOKEN"
          DEPLOY_URL="$DEPLOY_API/v1/deploys/$(jq -r .id "$RUNNER_TEMP/session.json")"
          export DEPLOY_TOKEN DEPLOY_URL
          upload() {
            [ -n "$1" ] || return 0
            curl -sS --fail-with-body --retry 3 --retry-all-errors -T "./$1" \
              -H "Authorization: Bearer $DEPLOY_TOKEN" -H 'Content-Type: application/octet-stream' \
              "$DEPLOY_URL/files/$(jq -rn --arg p "$1" '$p | split("/") | map(@uri) | join("/")')"
          }
          export -f upload
          if jq -e 'has("missing")' "$RUNNER_TEMP/session.json" > /dev/null; then
            # Delta: upload only what changed; the API copies the rest from the live release.
            echo "Delta deploy: $(jq '.missing | length' "$RUNNER_TEMP/session.json") to upload, $(jq '.reuse | length' "$RUNNER_TEMP/session.json") reused from the live release"
            jq -r '.missing[]' "$RUNNER_TEMP/session.json" | tr '\n' '\0' | xargs -r -0 -P 8 -n 1 bash -c 'upload "$1"' _
            reuse_batch() {
              [ -n "$1" ] || return 0
              curl -sS --fail-with-body --retry 3 --retry-all-errors -X POST \
                -H "Authorization: Bearer $DEPLOY_TOKEN" -H 'Content-Type: application/json' \
                --data-binary "$1" "$DEPLOY_URL/reuse" -w "reuse batch: HTTP %{http_code} in %{time_total}s\n"
            }
            export -f reuse_batch
            jq -c '.reuse as $r | range(0; $r | length; 100) as $i | {paths: $r[$i:$i + 100]}' \
              "$RUNNER_TEMP/session.json" | tr '\n' '\0' | xargs -r -0 -P 8 -n 1 bash -c 'reuse_batch "$1"' _
          else
            find . -type f -printf '%P\0' | xargs -0 -P 8 -n 1 bash -c 'upload "$1"' _
          fi
          curl -sS --fail-with-body -X POST -H "Authorization: Bearer $DEPLOY_TOKEN" "$DEPLOY_URL/commit"
          echo
          echo "Deployed ${GITHUB_REPOSITORY##*/} from ${GITHUB_SHA::7}"
