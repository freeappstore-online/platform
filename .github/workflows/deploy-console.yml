name: Deploy console

# Deploys the creator console SPA to R2 (prefix apps/console).
#
# User-facing URL is https://freeappstore.online/app/ — the storefront Pages
# Function sites/storefront/functions/app/[[path]].ts strips the /app prefix and
# proxies to the console origin console.freeappstore.online (which serves this
# apps/console prefix). The build MUST use a relative Vite base ('./') or the
# HTML asks for assets at the apex root and 404s. See sites/console/CLAUDE.md.
#
# Folded from the former freeappstore-online/console repo (2026-06-30, see
# PLAN-CONSOLIDATE-PLATFORM.md).
#
# Two things differ from the per-repo original:
#  - R2 prefix is HARDCODED to apps/console/ (G2). The old workflow derived it
#    from ${GITHUB_REPOSITORY##*/}, which resolves to "platform" in the monorepo
#    and would write to the wrong key. The host Worker's `routes` table maps
#    console.freeappstore.online -> apps/console, so this prefix must not drift.
#  - console is a nested pnpm workspace; `working-directory: sites/console` makes
#    pnpm root at the nearest pnpm-workspace.yaml (G3).
#
# Changes to sites/console on main deploy automatically from this monorepo.
# workflow_dispatch supports explicit redeployment of the same source.

on:
  push:
    branches: [main]
    paths:
      - 'sites/console/**'
      - '.github/workflows/deploy-console.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-console
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify build output
        run: |
          test -d ./web/dist || { echo "::error::No build output at web/dist"; exit 1; }
          test -n "$(ls -A ./web/dist)" || { echo "::error::web/dist is empty"; exit 1; }

      - name: Upload to R2 (prefix apps/console — must match the host routes table)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          aws s3 sync ./web/dist "s3://fas-apps/apps/console/" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --delete \
            --no-progress
          echo "Deployed apps/console from ${GITHUB_SHA::7}"
