name: Deploy console

# Deploys the creator console SPA (route apps/console) through the store API
# with a GitHub OIDC token: no R2 key anywhere in this workflow (#460). The API
# accepts only this workflow on main of this repo for the console app
# (packages/backend/src/routes/deploy.ts, PLATFORM_SITES), writes the files under
# an immutable release prefix and switches the route to it once complete.
#
# User-facing URL is https://freeappstore.online/app/ — the storefront Pages
# Function sites/storefront/functions/app/[[path]].ts strips the /app prefix and
# proxies to the console origin console.freeappstore.online (which serves this
# apps/console prefix). The build MUST use a relative Vite base ('./') or the
# HTML asks for assets at the apex root and 404s. See sites/console/CLAUDE.md.
#
# Folded from the former freeappstore-online/console repo (2026-06-30, see
# PLAN-CONSOLIDATE-PLATFORM.md).
#
# Two things differ from the per-repo original:
#  - The app id is fixed server-side to `console` (G2). The old workflow derived
#    its prefix from ${GITHUB_REPOSITORY##*/}, which resolves to "platform" in
#    the monorepo. The host Worker's `routes` table maps
#    console.freeappstore.online -> apps/console.
#  - console is a nested pnpm workspace; `working-directory: sites/console` makes
#    pnpm root at the nearest pnpm-workspace.yaml (G3).
#
# Changes to sites/console on main deploy automatically from this monorepo.
# workflow_dispatch supports explicit redeployment of the same source.

on:
  push:
    branches: [main]
    paths:
      - 'sites/console/**'
      - '.github/workflows/deploy-console.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-console
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify build output
        run: |
          test -d ./web/dist || { echo "::error::No build output at web/dist"; exit 1; }
          test -n "$(ls -A ./web/dist)" || { echo "::error::web/dist is empty"; exit 1; }

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app
          path: sites/console/web/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Runs no project code: no checkout, install or npx. Its only credential is
  # the job's OIDC token.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_API: https://api.freeappstore.online
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app
          path: site
      - name: Upload keylessly
        run: |
          set -euo pipefail
          cd site
          test -n "$(ls -A .)" || { echo "::error::build artifact is empty"; exit 1; }
          find . -type f -printf '%P\t%s\n' \
            | jq -Rn '{files: [inputs | split("\t") | {key: .[0], value: (.[1] | tonumber)}] | from_entries}' \
            > "$RUNNER_TEMP/manifest.json"
          oidc=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$DEPLOY_API" | jq -r .value)
          echo "::add-mask::$oidc"
          session=$(curl -sS --fail-with-body -X POST "$DEPLOY_API/v1/deploys" \
            -H "Authorization: Bearer $oidc" -H 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/manifest.json") \
            || { echo "::error::deploy refused: $session"; exit 1; }
          DEPLOY_TOKEN=$(jq -r .token <<<"$session")
          echo "::add-mask::$DEPLOY_TOKEN"
          DEPLOY_URL="$DEPLOY_API/v1/deploys/$(jq -r .id <<<"$session")"
          export DEPLOY_TOKEN DEPLOY_URL
          upload() {
            curl -sS --fail-with-body --retry 3 --retry-all-errors -T "./$1" \
              -H "Authorization: Bearer $DEPLOY_TOKEN" -H 'Content-Type: application/octet-stream' \
              "$DEPLOY_URL/files/$(jq -rn --arg p "$1" '$p | split("/") | map(@uri) | join("/")')"
          }
          export -f upload
          find . -type f -printf '%P\0' | xargs -0 -P 8 -n 1 bash -c 'upload "$1"' _
          curl -sS --fail-with-body -X POST -H "Authorization: Bearer $DEPLOY_TOKEN" "$DEPLOY_URL/commit"
          echo
          echo "Deployed console from ${GITHUB_SHA::7}"
