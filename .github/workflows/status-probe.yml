name: Status probe

# Status-page-style live probing. Every 15 minutes (and on demand) this hits the
# real deployed services and the cross-service /status aggregator, so token drift
# or a downed dependency surfaces as a failed run + notification BEFORE a creator
# hits it during `fas publish`. No mocks — these are the production endpoints.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: status-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Backend /health
        run: |
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://api.freeappstore.online/health)
          echo "backend /health → $CODE"
          [ "$CODE" = "200" ] || { echo '::error::backend /health is not 200'; exit 1; }

      - name: Backend /status (probes backend→admin auth, DB)
        run: |
          BODY=$(curl -sS -w '\n%{http_code}' --max-time 25 https://api.freeappstore.online/status)
          CODE=$(printf '%s' "$BODY" | tail -n1)
          JSON=$(printf '%s' "$BODY" | sed '$d')
          echo "$JSON" | jq .
          if [ "$CODE" != "200" ]; then
            echo "::error::/status degraded (HTTP $CODE) — see failed probes above"
            # Surface each red probe as an annotation.
            echo "$JSON" | jq -r '.checks[] | select(.status=="fail") | "::error::status probe failed: \(.name) — \(.detail)"'
            exit 1
          fi
          echo "✓ all backend status probes green"

      - name: KB host docs site
        run: |
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://docs.freeappstore.online/)
          echo "docs.freeappstore.online → $CODE"
          # 200 or a redirect to the index is fine; only a 5xx/timeout is a failure.
          case "$CODE" in 2*|3*) : ;; *) echo '::error::docs site unhealthy'; exit 1 ;; esac

      # The storefront registries are data in other repos, not admin Worker code,
      # so they are checked here rather than in the admin test suite (#51).
      - name: Store registries (apps + games)
        run: |
          FAIL=0
          for ENTRY in \
            "freeappstore-online/freeappstore apps" \
            "freegamestore-online/freegamestore games"; do
            set -- $ENTRY
            URL="https://raw.githubusercontent.com/$1/main/registry.json"
            CODE=$(curl -sS -o registry.json -w '%{http_code}' --max-time 20 "$URL")
            if [ "$CODE" != "200" ]; then
              echo "::error::$1 registry.json → HTTP $CODE"; FAIL=1; continue
            fi
            if ! jq -e --arg k "$2" '.[$k] | type == "array" and length > 0' registry.json > /dev/null; then
              echo "::error::$1 registry.json has no non-empty .$2 array"; FAIL=1; continue
            fi
            MISSING=$(jq -r --arg k "$2" '[.[$k][] | select((.id | not) or (.name | not))] | length' registry.json)
            DUPES=$(jq -r --arg k "$2" '[.[$k][].id] | group_by(.) | map(select(length > 1) | .[0]) | join(", ")' registry.json)
            COUNT=$(jq -r --arg k "$2" '.[$k] | length' registry.json)
            echo "$1 → $COUNT $2, $MISSING missing id/name, duplicate ids: ${DUPES:-none}"
            [ "$MISSING" = "0" ] || { echo "::error::$1 registry.json: $MISSING $2 entries missing id or name"; FAIL=1; }
            [ -z "$DUPES" ] || { echo "::error::$1 registry.json: duplicate ids: $DUPES"; FAIL=1; }
          done
          exit $FAIL

      - name: SKILLS.md has no secrets
        run: |
          URL=https://raw.githubusercontent.com/freeappstore-online/freeappstore/main/SKILLS.md
          CODE=$(curl -sS -o SKILLS.md -w '%{http_code}' --max-time 20 "$URL")
          echo "SKILLS.md → $CODE"
          [ "$CODE" = "200" ] || { echo "::error::SKILLS.md → HTTP $CODE"; exit 1; }
          if grep -nE 'CF-Access-Client-Secret|cfk_|cfut_|662a28f8' SKILLS.md; then
            echo '::error::SKILLS.md contains a token pattern (lines above)'; exit 1
          fi
          echo "✓ no token patterns in SKILLS.md"
