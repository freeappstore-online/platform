name: Status probe

# Status-page-style live probing. Every 15 minutes (and on demand) this hits the
# real deployed services and the cross-service /status aggregator, so token drift
# or a downed dependency surfaces as a failed run + notification BEFORE a creator
# hits it during `fas publish`. No mocks — these are the production endpoints.
#
# GitHub runs this schedule far less often than */15 (about every 5 h on
# 2026-11-23), so the reliable concurrency probe is the backend's own */15
# Worker cron (#642): it bursts `run` plus a rotating sample of apps and records
# failures in D1. This workflow reads them back from /v1/uptime (last 6 h) and
# a failed run opens or updates one `uptime-failure` issue, deduplicated.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # the notify job names the failed step
  checks: read    # and reads its ::error:: annotations
  issues: write   # to open / comment on the uptime-failure issue

concurrency:
  group: status-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Backend /health
        run: |
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://api.freeappstore.online/health)
          echo "backend /health → $CODE"
          [ "$CODE" = "200" ] || { echo '::error::backend /health is not 200'; exit 1; }

      - name: Backend /status (probes backend→admin auth, DB)
        run: |
          BODY=$(curl -sS -w '\n%{http_code}' --max-time 25 https://api.freeappstore.online/status)
          CODE=$(printf '%s' "$BODY" | tail -n1)
          JSON=$(printf '%s' "$BODY" | sed '$d')
          echo "$JSON" | jq .
          if [ "$CODE" != "200" ]; then
            echo "::error::/status degraded (HTTP $CODE) — see failed probes above"
            # Surface each red probe as an annotation.
            echo "$JSON" | jq -r '.checks[] | select(.status=="fail") | "::error::status probe failed: \(.name) — \(.detail)"'
            exit 1
          fi
          # Non-critical probes (e.g. app_ownership, #512) don't fail the run; annotate them.
          echo "$JSON" | jq -r '.checks[] | select(.status=="fail") | "::warning::status probe failed: \(.name) — \(.detail)"'
          echo "✓ all critical backend status probes green"

      - name: KB host docs site
        run: |
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://docs.freeappstore.online/)
          echo "docs.freeappstore.online → $CODE"
          # 200 or a redirect to the index is fine; only a 5xx/timeout is a failure.
          case "$CODE" in 2*|3*) : ;; *) echo '::error::docs site unhealthy'; exit 1 ;; esac

      # The storefront registries are data in other repos, not admin Worker code,
      # so they are checked here rather than in the admin test suite (#51).
      - name: Store registries (apps + games)
        run: |
          FAIL=0
          for ENTRY in \
            "freeappstore-online/freeappstore apps" \
            "freegamestore-online/freegamestore games"; do
            set -- $ENTRY
            URL="https://raw.githubusercontent.com/$1/main/registry.json"
            CODE=$(curl -sS -o registry.json -w '%{http_code}' --max-time 20 "$URL")
            if [ "$CODE" != "200" ]; then
              echo "::error::$1 registry.json → HTTP $CODE"; FAIL=1; continue
            fi
            if ! jq -e --arg k "$2" '.[$k] | type == "array" and length > 0' registry.json > /dev/null; then
              echo "::error::$1 registry.json has no non-empty .$2 array"; FAIL=1; continue
            fi
            MISSING=$(jq -r --arg k "$2" '[.[$k][] | select((.id | not) or (.name | not))] | length' registry.json)
            DUPES=$(jq -r --arg k "$2" '[.[$k][].id] | group_by(.) | map(select(length > 1) | .[0]) | join(", ")' registry.json)
            COUNT=$(jq -r --arg k "$2" '.[$k] | length' registry.json)
            echo "$1 → $COUNT $2, $MISSING missing id/name, duplicate ids: ${DUPES:-none}"
            [ "$MISSING" = "0" ] || { echo "::error::$1 registry.json: $MISSING $2 entries missing id or name"; FAIL=1; }
            [ -z "$DUPES" ] || { echo "::error::$1 registry.json: duplicate ids: $DUPES"; FAIL=1; }
          done
          exit $FAIL

      - name: SKILLS.md has no secrets
        run: |
          URL=https://raw.githubusercontent.com/freeappstore-online/freeappstore/main/SKILLS.md
          CODE=$(curl -sS -o SKILLS.md -w '%{http_code}' --max-time 20 "$URL")
          echo "SKILLS.md → $CODE"
          [ "$CODE" = "200" ] || { echo "::error::SKILLS.md → HTTP $CODE"; exit 1; }
          if grep -nE 'CF-Access-Client-Secret|cfk_|cfut_|662a28f8' SKILLS.md; then
            echo '::error::SKILLS.md contains a token pattern (lines above)'; exit 1
          fi
          echo "✓ no token patterns in SKILLS.md"

      # The Worker cron's bursts (#642): any failure in the last 6 h, and proof
      # that the cron still runs (a burst:run row within the last hour).
      - name: Worker cron burst probes (/v1/uptime)
        run: |
          set -euo pipefail
          JSON=$(curl -sS --fail --max-time 20 https://api.freeappstore.online/v1/uptime)
          echo "$JSON" | jq -r '.recentFailures[] | "::error::uptime failure: \(.target) \(.url) — \(.error // "no error text") at \(.checkedAt / 1000 | floor | todate)"'
          LAST=$(echo "$JSON" | jq -r '[.targets[] | select(.target == "burst:run") | .checkedAt][0] // 0')
          AGE_MIN=$(( ($(date +%s) * 1000 - LAST) / 60000 ))
          echo "last Worker cron burst: ${AGE_MIN} min ago; failures in last 6 h: $(echo "$JSON" | jq '.recentFailures | length')"
          [ "$AGE_MIN" -le 60 ] || { echo "::error::the */15 uptime cron has not recorded a burst for ${AGE_MIN} min"; exit 1; }
          [ "$(echo "$JSON" | jq '.recentFailures | length')" = "0" ]

      # The same overlap from outside Cloudflare (#642), whenever GitHub runs this.
      - name: Live app bursts
        run: node scripts/verify-app-host.mjs --burst-only

  notify:
    needs: probe
    if: always() && needs.probe.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Same approach as prod-smoke.yml: one open labelled issue; a repeat of
      # the same failed steps is suppressed for 6 h, a change always posts.
      - name: Open / update the uptime-failure issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PROBE_RESULT: ${{ needs.probe.result }}
        with:
          script: |
            const label = 'uptime-failure'
            const repo = { owner: context.repo.owner, repo: context.repo.repo }
            const runUrl = `https://github.com/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`
            const REPEAT_AFTER_MS = 6 * 60 * 60 * 1000

            const failedSteps = []
            const errors = []
            try {
              const { data } = await github.rest.actions.listJobsForWorkflowRun({ ...repo, run_id: context.runId })
              for (const job of data.jobs ?? []) {
                if (job.name === 'notify') continue
                for (const step of job.steps ?? []) if (step.conclusion === 'failure') failedSteps.push(step.name)
                const checkRunId = Number(String(job.check_run_url ?? '').split('/').pop())
                if (!Number.isFinite(checkRunId)) continue
                const { data: ann } = await github.rest.checks.listAnnotations({ ...repo, check_run_id: checkRunId })
                for (const a of ann ?? []) if (a.annotation_level === 'failure' && a.message) errors.push(a.message.trim())
              }
            } catch (err) {
              core.warning(`could not collect failure detail: ${err.message}`)
            }

            const signature = [process.env.PROBE_RESULT, ...failedSteps].join(' | ')
            const marker = `<!-- uptime-failure-sig: ${require('node:crypto').createHash('sha256').update(signature).digest('hex').slice(0, 32)} -->`
            const body = [
              `Status probe **${process.env.PROBE_RESULT}** at ${new Date().toISOString()}.`,
              failedSteps.length ? `**Failed step:** ${failedSteps.join(', ')}` : '_No failed step recorded; the runner may never have started._',
              errors.length ? '```\n' + errors.join('\n').slice(0, 2000) + '\n```' : '',
              `See run: ${runUrl}`,
              'Worker cron history: `SELECT * FROM health_checks WHERE ok = 0 ORDER BY checked_at DESC LIMIT 50` (D1 `fas`), or GET https://api.freeappstore.online/v1/uptime.',
              marker,
            ].filter(Boolean).join('\n\n')

            const { data: open } = await github.rest.issues.listForRepo({ ...repo, labels: label, state: 'open' })
            if (open.length === 0) {
              const { data: created } = await github.rest.issues.create({ ...repo, title: 'uptime failing', labels: [label], body })
              core.info(`opened #${created.number}`)
              return
            }
            const issue = open[0]
            const page = Math.max(1, Math.ceil((issue.comments ?? 0) / 100))
            const { data: comments } = await github.rest.issues.listComments({ ...repo, issue_number: issue.number, per_page: 100, page })
            const last = comments.at(-1) ?? { body: issue.body, created_at: issue.created_at }
            if (last.body?.includes(marker) && Date.now() - new Date(last.created_at).getTime() < REPEAT_AFTER_MS) {
              core.info(`same failure as #${issue.number} posted <6 h ago; not re-commenting`)
              return
            }
            await github.rest.issues.createComment({ ...repo, issue_number: issue.number, body })
            core.info(`commented on #${issue.number}`)
