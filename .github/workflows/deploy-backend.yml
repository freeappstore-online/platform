name: Deploy Worker

# Auto-deploys the freeappstore-api Worker on every push to main that
# touches the backend package. wrangler deploy is idempotent (it
# fingerprints the bundle), so re-runs without changes are no-ops.
#
# Migrations are applied first; if they fail, the deploy doesn't run,
# preventing a Worker from talking to a schema it doesn't expect.

on:
  push:
    branches: [main]
    paths:
      - 'packages/backend/**'
      # The backend imports @freeappstore/compliance via workspace, so
      # compliance source changes alter the deployed Worker even when
      # backend itself doesn't change. Skipping these previously left
      # the deployed audit silently behind the source-of-truth fixes.
      - 'packages/compliance/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Don't let a slow deploy block a newer commit. Latest push wins.
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build first so cli can resolve @freeappstore/compliance types via
      # its dist/index.d.ts. Same fix as ci.yml + publish.yml.
      - name: Build
        run: pnpm -r --filter './packages/*' build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Tests
        run: pnpm test

      - name: Apply D1 migrations
        working-directory: packages/backend
        run: pnpm exec wrangler d1 migrations apply fas --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Runtime Worker secrets are not set here. They live SOPS-encrypted in
      # ~/dev/ops (serge-ivo/ops); `ops put fas <KEY>` stores a value and pushes
      # it to every consumer in inventory.yaml, including this Worker
      # (freeappstore-api). Re-place one: `ops push fas <KEY> wrangler freeappstore-api`.

      - name: Ensure temporary photo bucket and retention
        working-directory: packages/backend
        run: |
          pnpm exec wrangler r2 bucket info fas-uploads > /dev/null 2>&1 || pnpm exec wrangler r2 bucket create fas-uploads
          pnpm exec wrangler r2 bucket lifecycle set fas-uploads --file config/uploads-lifecycle.json --force
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        working-directory: packages/backend
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Post-deploy: /status actively probes every downstream dependency
      # (admin auth round-trip, GitHub, DB, KV). A red probe fails the deploy.
      - name: Smoke test (/health + /status probes)
        run: |
          ok=""
          for i in 1 2 3 4 5; do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" https://api.freeappstore.online/health)
            if [ "$CODE" = "200" ]; then echo "✓ /health 200"; ok=1; break; fi
            echo "attempt $i: /health $CODE, retrying..."; sleep 5
          done
          [ -n "$ok" ] || { echo "✗ /health never 200 after deploy"; exit 1; }
          echo "Probing /status ..."
          BODY=$(curl -sS -w "\n%{http_code}" https://api.freeappstore.online/status)
          CODE=$(printf '%s' "$BODY" | tail -n1)
          printf '%s\n' "$BODY" | sed '$d'
          if [ "$CODE" != "200" ]; then
            echo "✗ /status reported a degraded dependency (HTTP $CODE)"; exit 1
          fi
          echo "✓ all status probes green"
