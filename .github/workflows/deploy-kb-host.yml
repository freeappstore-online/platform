name: Deploy KB Host Worker

# freeappstore-kb-host serves generated app Knowledge Base sites from the shared
# fas-kb R2 bucket at kb.freeappstore.online/<app>/ and official platform docs at
# docs.freeappstore.online/. Dedicated subdomains (not wildcards), so it is safe
# to auto-deploy on change.

on:
  push:
    branches: [main]
    paths: ['packages/kb-host/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-kb-host
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: packages/kb-host
        run: pnpm exec tsc --noEmit
      # Push secrets from Doppler before deploy (source of truth; no manual
      # `wrangler secret put`). Manifest: packages/kb-host/.doppler-secrets.
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3
      - name: Sync secrets from Doppler
        run: bash scripts/sync-worker-secrets.sh packages/kb-host
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        working-directory: packages/kb-host
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
