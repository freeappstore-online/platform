name: Deploy KB Host Worker

# freeappstore-kb-host serves generated app Knowledge Base sites from the shared
# fas-kb R2 bucket at kb.freeappstore.online/<app>/ and official platform docs at
# docs.freeappstore.online/. Dedicated subdomains (not wildcards), so it is safe
# to auto-deploy on change.

on:
  push:
    branches: [main]
    paths: ['packages/kb-host/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-kb-host
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: packages/kb-host
        run: pnpm exec tsc --noEmit
      # Runtime Worker secrets are not set here. They live SOPS-encrypted in
      # ~/dev/ops (serge-ivo/ops); `ops put fas <KEY>` stores a value and pushes
      # it to every consumer in inventory.yaml, including this Worker
      # (freeappstore-kb-host). Re-place one: `ops push fas <KEY> wrangler freeappstore-kb-host`.
      - name: Deploy Worker
        working-directory: packages/kb-host
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
