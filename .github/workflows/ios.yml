name: iOS Companion
on:
  # Store presentation/docs do not change the app binary; bundled app assets and
  # privacy manifests remain covered by ios/** (#868).
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '!ios/store-assets/**'
      - '!ios/README.md'
      - '!ios/store-listing.md'
      - '!ios/store-submission-readiness.md'
      - '!ios/release/README.md'
      - '!ios/Privacy/README.md'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '!ios/store-assets/**'
      - '!ios/README.md'
      - '!ios/store-listing.md'
      - '!ios/store-submission-readiness.md'
      - '!ios/release/README.md'
      - '!ios/Privacy/README.md'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload and verify availability in the configured internal TestFlight group
        type: boolean
        default: false
      archive_for_local_upload:
        description: Build an unsigned Xcode 26+ archive for account-backed export/upload on the maintainer Mac
        type: boolean
        default: false
permissions: { contents: read }
jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with: { xcode-version: '16' }
      # XcodeGen is pinned (not brew's latest): generator versions change the output, e.g. 2.47 adds
      # buildArchitectures to schemes. Bump this and regenerate locally with the same version together.
      - name: Project is in sync with project.yml
        env: { XCODEGEN_VERSION: 2.45.4, XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef }
        run: |
          curl -fsSLo "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          cd ios && "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate && git diff --exit-code -- FreeAppStore.xcodeproj
      # Build number = workflow run number, FAS_COMMIT = short SHA and FAS_DEV_BUILD=NO (all default in Config/Version.xcconfig
      # for local builds). Ad-hoc signed, not CODE_SIGNING_ALLOWED=NO: an unsigned test host has no Keychain entitlement
      # (errSecMissingEntitlement, -34018), which SecureStoreTests and FasApiTests need.
      # Runner images change which simulators exist, so a fixed device name fails at random. Use the
      # newest available iPhone simulator instead.
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; ios=sorted((k for k in d if "iOS" in k), key=lambda k: [int(x) for x in k.rsplit("iOS-",1)[1].split("-")]); print(next(x["udid"] for k in reversed(ios) for x in d[k] if x["name"].startswith("iPhone")))')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Unit tests (simulator, ad-hoc signed)
        run: xcodebuild -project ios/FreeAppStore.xcodeproj -scheme FreeAppStore -destination 'id=${{ steps.sim.outputs.udid }}' -derivedDataPath build/ios test CODE_SIGN_IDENTITY=- CURRENT_PROJECT_VERSION=${{ github.run_number }} FAS_COMMIT="${GITHUB_SHA::7}" FAS_DEV_BUILD=NO
      - name: Device build (unsigned)
        run: xcodebuild -project ios/FreeAppStore.xcodeproj -scheme FreeAppStore -destination 'generic/platform=iOS' -derivedDataPath build/ios build CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} FAS_COMMIT="${GITHUB_SHA::7}" FAS_DEV_BUILD=NO

  release-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22' }
      - run: node --test ios/release/testflight.test.mjs
      - run: python3 -m unittest discover -s ios/release -p '*_test.py'
      - run: bash -n ios/release/upload.sh && shellcheck ios/release/upload.sh

  # #863: uploads are manual and main-only. A green job means Apple processed the build and
  # the configured internal group has access, not merely that xcodebuild uploaded an archive.
  testflight:
    needs: [build-test, release-tools]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-26
    timeout-minutes: 60
    concurrency: { group: fas-ios-testflight, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22' }
      - name: Validate release configuration
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          ASC_BETA_GROUP_ID: ${{ vars.ASC_BETA_GROUP_ID }}
        run: |
          missing=0
          for name in IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_APPSTORE_PROFILE_BASE64 ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_KEY_P8_BASE64 IOS_TEAM_ID ASC_APP_ID ASC_BETA_GROUP_ID; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing $name. See ios/release/README.md and #863."; missing=1; fi
          done
          (( missing == 0 )) || exit 1
          version=$(sed -n 's/^MARKETING_VERSION = //p' ios/Config/Version.xcconfig)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "IOS_MARKETING_VERSION=$version" >> "$GITHUB_ENV"
          major=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          (( major >= 26 )) || { echo '::error::App Store Connect requires Xcode 26 or newer'; exit 1; }
      - name: Verify app and tester group; choose monotonic build number
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          ASC_BETA_GROUP_ID: ${{ vars.ASC_BETA_GROUP_ID }}
        run: node ios/release/testflight.mjs preflight
      - name: Archive, validate signing, export and upload
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
        run: bash ios/release/upload.sh
      - name: Wait for processing and verify internal tester availability
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          ASC_BETA_GROUP_ID: ${{ vars.ASC_BETA_GROUP_ID }}
        run: node ios/release/testflight.mjs verify

  # Uses no signing secrets. Existing Xcode account access can sign and upload this supported-SDK
  # archive on the maintainer Mac. It is not an installable app and is retained for one day only.
  archive-for-local-upload:
    needs: [build-test, release-tools]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.archive_for_local_upload
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with: { xcode-version: latest-stable }
      - name: Archive without credentials
        run: |
          major=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          (( major >= 26 )) || exit 1
          xcodebuild -project ios/FreeAppStore.xcodeproj -scheme FreeAppStore -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/FreeAppStore.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" FAS_COMMIT="${GITHUB_SHA:0:7}" FAS_DEV_BUILD=NO
      - name: Bind archive to commit, bundle, version and build
        run: |
          version=$(sed -n 's/^MARKETING_VERSION = //p' ios/Config/Version.xcconfig)
          python3 ios/release/archive-manifest.py create "$RUNNER_TEMP/FreeAppStore.xcarchive" "$RUNNER_TEMP/archive-input.json" "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$version"
          ditto -c -k --keepParent "$RUNNER_TEMP/FreeAppStore.xcarchive" "$RUNNER_TEMP/FreeAppStore.xcarchive.zip"
          cd "$RUNNER_TEMP" && shasum -a 256 FreeAppStore.xcarchive.zip > archive.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fas-ios-archive-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/FreeAppStore.xcarchive.zip
            ${{ runner.temp }}/archive-input.json
            ${{ runner.temp }}/archive.sha256
