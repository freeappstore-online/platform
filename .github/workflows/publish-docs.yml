name: Publish Platform Docs

# Public platform documentation is published with Zensical to the shared KB host.
# MkDocs is only the generated config format consumed by Zensical; do not publish
# these docs with a separate MkDocs or VitePress deployment.

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/publish-docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-platform-docs
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Zensical site
        run: |
          python -m pip install --quiet zensical
          rm -rf zensical-src site public
          mkdir -p zensical-src/assets zensical-src/stylesheets
          cp -r docs/. zensical-src/
          # Exclude internal spec docs from the public site
          rm -f zensical-src/APP-SECRET-PROXY.md zensical-src/FREE-API-STRATEGY.md
          rm -f zensical-src/FRIENDS-SPEC.md zensical-src/INTEGRATIONS-STRATEGY.md
          rm -f zensical-src/VCQA-INTEGRATION-SPEC.md zensical-src/LIMITS.md
          cat > zensical-src/assets/logo.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#10b981"/></linearGradient></defs><rect width="512" height="512" rx="96" fill="url(#bg)"/><text x="256" y="346" font-family="Manrope, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="300" fill="white" text-anchor="middle">F</text></svg>
          SVG
          cp zensical-src/assets/logo.svg zensical-src/assets/favicon.svg
          cat > zensical-src/stylesheets/extra.css <<'CSS'
          :root > * {
            --md-primary-fg-color: #10b981;
            --md-primary-fg-color--light: #34d399;
            --md-primary-fg-color--dark: #059669;
            --md-accent-fg-color: #10b981;
          }
          [data-md-color-scheme="slate"] {
            --md-primary-fg-color: #34d399;
            --md-primary-fg-color--light: #6ee7b7;
            --md-primary-fg-color--dark: #10b981;
            --md-accent-fg-color: #34d399;
          }
          .md-header__title { font-weight: 700; letter-spacing: -0.01em; }
          CSS
          cat > mkdocs.yml <<'YAML'
          site_name: FreeAppStore Platform Docs
          site_url: https://docs.freeappstore.online/
          docs_dir: zensical-src
          copyright: Built on FreeAppStore · freeappstore.online
          theme:
            name: material
            logo: assets/logo.svg
            favicon: assets/favicon.svg
            palette:
              - media: "(prefers-color-scheme: light)"
                scheme: default
                primary: custom
                accent: custom
                toggle:
                  icon: lucide/sun
                  name: Switch to dark mode
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                primary: custom
                accent: custom
                toggle:
                  icon: lucide/moon
                  name: Switch to light mode
          extra_css:
            - stylesheets/extra.css
          nav:
            - Home: index.md
            - Getting Started: getting-started.md
            - SDK: sdk.md
            - UI Components: ui.md
            - CLI: cli.md
            - Publishing: publishing.md
            - Proxy & Keys: proxy-and-keys.md
            - Limits: platform-limits.md
            - Architecture: architecture.md
            - MCP: mcp.md
          YAML
          python -m zensical build
      - name: Publish to kb-host
        env:
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
        run: |
          if [ -z "$INTERNAL_TOKEN" ]; then echo "INTERNAL_TOKEN missing — cannot publish docs"; exit 1; fi
          out=site
          [ -d "$out" ] || out=public
          cd "$out"
          find . -type f | while read -r f; do
            curl -fsS -X PUT "https://kb.freeappstore.online/_ingest/platform/${f#./}" -H "x-internal-token: $INTERNAL_TOKEN" --data-binary "@$f" >/dev/null
          done
          echo "Platform docs published → https://docs.freeappstore.online/"
