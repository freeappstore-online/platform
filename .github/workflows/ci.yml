name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build first so cross-package type imports resolve (cli imports
      # @freeappstore/compliance types from its dist/index.d.ts).
      - name: Build
        run: pnpm -r --filter './packages/*' build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm test

  # Live e2e against `wrangler dev --local` (miniflare). Catches integration
  # regressions that unit tests miss: real D1, real Hono routing through the
  # Worker bundle, real WebSocket upgrade through the Durable Object.
  # Adds ~30s to CI but covers the parts where unit-test mocks lie.
  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r --filter './packages/*' build

      - name: Set up local D1 + test user
        working-directory: packages/backend
        run: |
          # .dev.vars supplies the local SESSION_SIGNING_KEY that the e2e
          # script also uses (must match for HMAC verify to succeed).
          cat > .dev.vars <<'EOF'
          SESSION_SIGNING_KEY=local_test_key_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          GITHUB_CLIENT_SECRET=local_test_client_secret_dummy_value_not_real
          EOF
          npx wrangler d1 migrations apply fas --local
          npx wrangler d1 execute fas --local --command "INSERT OR IGNORE INTO users (id, github_id, github_login, avatar_url, created_at) VALUES ('gh:1', 1, 'testuser', NULL, $(date +%s)000)"

      - name: Start wrangler dev
        working-directory: packages/backend
        run: |
          npx wrangler dev --port 8787 > /tmp/wrangler.log 2>&1 &
          # Wait for /health to respond before continuing.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8787/health > /dev/null 2>&1; then
              echo "wrangler dev ready"
              exit 0
            fi
            sleep 1
          done
          echo "wrangler dev failed to start within 30s"
          cat /tmp/wrangler.log
          exit 1

      - name: Run e2e script
        run: node scripts/e2e-local.mjs

      - name: Show wrangler logs on failure
        if: failure()
        run: cat /tmp/wrangler.log || true
