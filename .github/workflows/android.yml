name: Android Companion

# Builds, unit-tests and lints the FAS Android companion, runs the instrumented CompanionTest on an emulator and,
# on main, builds a signed release APK + AAB and optionally uploads it to Google Play. Ported from
# proappstore-online/platform's android.yml without the runner router (#621, #651). The release job is skipped
# until the repo-level upload-key secrets exist (android/README.md, Release). The Play track defaults to internal.
on:
  push:
    branches: [main]
    paths: ['android/**', 'scripts/*android*', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'scripts/*android*', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Upload to Google Play after building and signing
        type: boolean
        default: false
      track:
        description: Google Play target track
        type: choice
        options: [internal, production]
        default: internal
      status:
        description: Draft for initial setup; completed for a ready release
        type: choice
        options: [draft, completed]
        default: draft
permissions: { contents: read }
# Never cancel a main run midway: its release job may be committing a Play edit.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Build, unit test and lint
        working-directory: android
        # A numbered CI build, not "dev" (#832): the release job picks its own, higher-or-equal number.
        env: { ANDROID_BUILD_NUMBER: '${{ github.run_number }}' }
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Debug APK and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: freeappstore-android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests (CompanionTest)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: android
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Instrumented test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: freeappstore-android-connected
          path: android/app/build/reports/androidTests/

  # Job-level `if` cannot read secrets, so this job checks for the upload-key secrets and the release job is
  # skipped cleanly while they are absent. The repo is private: they must be repo-level secrets, not org secrets.
  release-gate:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_UPLOAD_KEYSTORE_BASE64" && -n "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" && -n "$ANDROID_UPLOAD_KEY_ALIAS" && -n "$ANDROID_UPLOAD_KEY_PASSWORD" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Android release skipped: the ANDROID_UPLOAD_* repo secrets are not set (android/README.md, Release).'
          fi

  release:
    needs: [build, release-gate]
    if: needs.release-gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Signing and Play secrets are step-scoped: the setup actions never see them (#748).
    env:
      PUBLISH_PLAY: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || github.event_name == 'push' && vars.ANDROID_PLAY_PUBLISH_ENABLED == 'true' }}
      PLAY_TRACK: ${{ github.event_name == 'workflow_dispatch' && inputs.track || vars.ANDROID_PLAY_TRACK || 'internal' }}
      PLAY_STATUS: ${{ github.event_name == 'workflow_dispatch' && inputs.status || 'completed' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Choose a monotonic Android version code
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          minimum=$(sed -n 's/^versionCode=//p' android/version.properties)
          [[ "$minimum" =~ ^[1-9][0-9]*$ ]] || exit 1
          if (( GITHUB_RUN_NUMBER > minimum )); then minimum=$GITHUB_RUN_NUMBER; fi
          if [[ "$PUBLISH_PLAY" == 'true' ]]; then
            version_code=$(node scripts/android-play-release.mjs next-code "$minimum")
          else
            version_code=$minimum
          fi
          echo "ANDROID_BUILD_NUMBER=$version_code" >> "$GITHUB_ENV"
      - name: Build and verify signed APK and AAB
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: bash scripts/build-android-release.sh
      - name: Keep signed artifacts and R8 mapping
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: freeappstore-android-release-${{ github.run_number }}
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
            android/app/build/outputs/release/release.json
            android/signing/upload-certificate.pem
      - name: Publish and verify Google Play track
        if: env.PUBLISH_PLAY == 'true'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: node scripts/android-play-release.mjs publish android/app/build/outputs/bundle/release/app-release.aab "$ANDROID_BUILD_NUMBER" "$PLAY_TRACK" "$PLAY_STATUS"
      - name: Release result
        if: success()
        shell: bash
        run: |
          echo "Signed APK and AAB: versionCode=$ANDROID_BUILD_NUMBER, commit=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PUBLISH_PLAY" == 'true' ]]; then
            echo "Google Play track verified: $PLAY_TRACK ($PLAY_STATUS). Store review/availability is separate." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Google Play upload was not requested. Signed artifacts are ready for the first manual Play Console upload.' >> "$GITHUB_STEP_SUMMARY"
          fi
