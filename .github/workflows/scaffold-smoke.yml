name: Scaffold smoke

# For every (cli, template) pair: clone the template via the CLI, install,
# build, and run the CLI's own `check`. Asserts that a fresh user running
# `fas init` / `fgs init` ends up with a runnable, compliance-passing app.
#
# Why this exists: in a single afternoon we found six template bugs that
# each made the corresponding `init` flow ship a non-buildable / non-passing
# scaffold (wrong @freegamestore/games pin, missing dep declaration, missing
# manifest.json, dead local Shell.tsx using h-screen, false-positive
# tracker-list literal, missing orientation/min_viewport_width). Unit tests
# all passed throughout. This workflow catches that whole class — anything
# that breaks the *new contributor's first 90 seconds*.
#
# Schedule daily so template-side drift (someone pushes a regression to a
# template repo, or the published @freegamestore/games SDK changes shape)
# is surfaced even when nothing in this repo changes.

on:
  push:
    branches: [main]
    paths:
      - 'packages/cli/**'
      - 'packages/compliance/**'
      - 'packages/quality/**'      # a CLI dependency since #281
      - 'scripts/check-scaffold-shell.sh'
      - 'packages/sdk/**'
      - 'packages/e2e/scaffold/**'
      - 'packages/e2e/scaffold.config.ts'
      - 'scripts/developer-recipes.test.ts'
      - 'workers/mcp/src/sdk-reference.ts'
      - 'packages/e2e/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/scaffold-smoke.yml'
      - '.github/workflows/publish.yml'
      - 'scripts/published-scaffold.sh'
      - 'scripts/template-release.mjs'
      - 'scripts/accept-starter-release.sh'
      - 'scripts/prepare-sdk-release.sh'
  pull_request:
    branches: [main]
    paths:
      - 'packages/cli/**'
      - 'packages/compliance/**'
      - 'packages/quality/**'      # a CLI dependency since #281
      - 'scripts/check-scaffold-shell.sh'
      - 'packages/sdk/**'
      - 'packages/e2e/scaffold/**'
      - 'packages/e2e/scaffold.config.ts'
      - 'scripts/developer-recipes.test.ts'
      - 'workers/mcp/src/sdk-reference.ts'
      - 'packages/e2e/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/scaffold-smoke.yml'
      - '.github/workflows/publish.yml'
      - 'scripts/published-scaffold.sh'
      - 'scripts/template-release.mjs'
      - 'scripts/accept-starter-release.sh'
      - 'scripts/prepare-sdk-release.sh'
  schedule:
    # 04:30 UTC daily — independent of CLI changes, so template-side drift
    # surfaces here on its own schedule.
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cli: cli
            cli_bin: fas
            template: standalone
          - cli: cli
            cli_bin: fas
            template: connected
          # fgs-cli legs removed 2026-06-02: the FGS CLI + games SDK were split
          # out of this repo into freegamestore-online/platform, which owns its
          # own scaffold-smoke. Keeping them here built packages/fgs-cli (no
          # longer present), so every fgs leg failed with "Cannot find module".

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install platform deps + build CLIs
        run: |
          pnpm install --frozen-lockfile
          # Build the CLI we're about to exercise plus every workspace package
          # it depends on (the trailing "..." makes pnpm include them, in
          # order), so a new dependency can't break this step again. Listing
          # them by hand missed @freeappstore/quality (#281). The CLI clones
          # the template repo from GitHub via plain `git clone`, so templates
          # don't need setting up locally.
          pnpm --filter "{./packages/${{ matrix.cli }}}..." build

      - name: Configure git identity (init runs a git commit on the scaffold)
        # The CLI's `init` does `git init` + `git commit -m ...` after
        # substituting APPNAME, which fails with "empty ident name not
        # allowed" on a fresh runner. A real user typically has a global
        # identity from their normal git use, but CI doesn't.
        run: |
          git config --global user.email "scaffold-smoke@freeappstore.online"
          git config --global user.name "Scaffold Smoke"

      - name: Scaffold via the CLI
        # Run the CLI in a clean tmp dir to isolate from the platform workspace.
        # Use a deterministic app id like `smoke3d` so it's a valid id and so
        # the matrix shows which template ran on each row.
        run: |
          set -euo pipefail
          mkdir -p /tmp/scaffold-smoke
          cd /tmp/scaffold-smoke
          APP_ID="smk-${{ matrix.template }}"
          # Sanitize: app ids must start with a letter, lowercase, hyphens ok.
          APP_ID="${APP_ID//[^a-z0-9-]/}"
          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"
          node "$GITHUB_WORKSPACE/packages/${{ matrix.cli }}/dist/index.js" \
            init "$APP_ID" --template="${{ matrix.template }}" --preset connectivity

      - name: Capability repeat install preserves the fresh scaffold
        working-directory: /tmp/scaffold-smoke
        run: |
          set -euo pipefail
          cd "$APP_ID"
          node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" add connectivity --dry-run
          node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" add connectivity
          test -z "$(git status --porcelain)"
          test -f fas-capabilities/connectivity.ts
          test -f .fas-capabilities.json

      - name: Scaffold starts on the SDK Shell with nav (#93)
        # Every new app must render the SDK Shell with real nav items from the
        # first render: no hand-rolled Shell.tsx, no Firebase, an SDK with the
        # navbar + resilience layer. Both presets keep public screens available;
        # connected features request sign-in at the feature boundary.
        working-directory: /tmp/scaffold-smoke
        run: bash "$GITHUB_WORKSPACE/scripts/check-scaffold-shell.sh" "$APP_ID" "${{ matrix.template }}"

      - name: Install scaffold deps
        working-directory: /tmp/scaffold-smoke
        run: |
          cd "$APP_ID"
          # Use plain `pnpm install` (not --frozen-lockfile) because the
          # template's lockfile may be hash-locked to "@APPNAME" while we
          # just substituted to a real id. This matches what a new user
          # actually runs. Keep each template lockfile current with the SDK:
          # this published-SDK leg intentionally verifies what new apps receive,
          # including Shell resilience fixes such as the offline-banner reset.
          # #332: publishing a fixed SDK does not update a template's lockfile.
          # shell.spec.ts checks the installed version as well as installed-app
          # behavior. Update BOTH template repos' SDK locks when releasing fixes;
          # do not upgrade dependencies here and hide what fas init delivers.
          # fas init adds the PWA capability and updates the SDK requirement.
          # Resolve those generated manifest changes instead of freezing the
          # template's pre-capability lock. This is a fresh disposable scaffold.
          source "$GITHUB_WORKSPACE/scripts/published-scaffold.sh"
          SDK_VERSION=$(node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync("web/package.json")).dependencies["@freeappstore/sdk"]; if (!/^\^[0-9]+\.[0-9]+\.[0-9]+$/.test(value)) throw new Error("Expected canonical SDK floor"); console.log(value.slice(1));')
          PUBLISHED_REGISTRY_DEADLINE=$(( $(date +%s) + 300 ))
          wait_for_published_version "@freeappstore/sdk" "$SDK_VERSION"
          install_published_scaffold_dependencies

      - name: Typecheck guardrail accepts custom layouts and rejects invalid SDK calls
        working-directory: /tmp/scaffold-smoke
        run: node "$GITHUB_WORKSPACE/packages/e2e/scaffold/typecheck-guardrail.mjs" "$APP_ID"

      - name: Build scaffold
        working-directory: /tmp/scaffold-smoke
        run: |
          cd "$APP_ID"
          node "$GITHUB_WORKSPACE/packages/e2e/scaffold/prepare-artifact.mjs" .
          pnpm run --if-present typecheck
          FAS_EXAMPLE_APP="$PWD" pnpm --dir "$GITHUB_WORKSPACE" exec vitest run scripts/developer-recipes.test.ts
          pnpm build

      - name: Run CLI compliance check on the scaffold
        working-directory: /tmp/scaffold-smoke
        run: |
          cd "$APP_ID"
          # `fas check` and `fgs check` exit non-zero on any hard fail.
          # Warnings are tolerated (they're informational by design).
          node "$GITHUB_WORKSPACE/packages/${{ matrix.cli }}/dist/index.js" check

      - name: Install browser
        timeout-minutes: 10
        # A stalled apt/CDN mirror must fail visibly; rerun this job on a fresh runner.
        run: pnpm --filter @freeappstore/e2e exec playwright install --with-deps chromium webkit

      - name: Validate deployment artifact and identity
        working-directory: /tmp/scaffold-smoke
        run: |
          cd "$APP_ID"
          node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" build-target --artifact --app-id "$APP_ID"

      - name: Browser feature smoke against produced artifact
        env:
          SCAFFOLD_DIR: /tmp/scaffold-smoke/${{ env.APP_ID }}
          SCAFFOLD_TEMPLATE: ${{ matrix.template }}
          SCAFFOLD_ARTIFACT: '1'
        run: pnpm --filter @freeappstore/e2e exec playwright test --config scaffold.config.ts

      - name: Browser check of fresh scaffold (published SDK)
        env:
          SCAFFOLD_DIR: /tmp/scaffold-smoke/${{ env.APP_ID }}
          SCAFFOLD_TEMPLATE: ${{ matrix.template }}
        run: pnpm --filter @freeappstore/e2e exec playwright test --config scaffold.config.ts

      # Also exercise this checkout's SDK so an unpublished Shell regression
      # fails CI, rather than waiting for the next npm release to expose it.
      - name: Install checkout SDK into disposable scaffold
        run: |
          pnpm --filter @freeappstore/sdk build
          pnpm --filter @freeappstore/sdk pack --pack-destination /tmp/scaffold-sdk
          cd "/tmp/scaffold-smoke/$APP_ID"
          pnpm --filter "./web" add /tmp/scaffold-sdk/freeappstore-sdk-*.tgz

      - name: Browser check of fresh scaffold (checkout SDK)
        env:
          SCAFFOLD_DIR: /tmp/scaffold-smoke/${{ env.APP_ID }}
          SCAFFOLD_TEMPLATE: ${{ matrix.template }}
        run: pnpm --filter @freeappstore/e2e exec playwright test --config scaffold.config.ts

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: scaffold-browser-${{ matrix.template }}
          path: packages/e2e/test-results/
          if-no-files-found: ignore

      - name: Show scaffold tree on failure
        if: failure()
        working-directory: /tmp/scaffold-smoke
        run: |
          echo "::group::scaffolded files"
          find "$APP_ID" -type f -not -path "*/node_modules/*" | head -40
          echo "::endgroup::"
          echo "::group::root package.json"
          cat "$APP_ID/package.json" || true
          echo "::endgroup::"
          echo "::group::web/package.json"
          cat "$APP_ID/web/package.json" || true
          echo "::endgroup::"
