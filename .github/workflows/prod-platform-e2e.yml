name: Prod platform e2e

# The real creator pipeline against live production — the FAS counterpart to
# FGS's prod-create-canary. Exercises the path a creator actually uses:
#
#   exchange GitHub token -> fas session
#   POST api/v1/publish   -> admin provisions repo (template-standalone) + CF
#                            Pages + DNS + D1 route + storefront registry
#   verify                -> GitHub repo, host live, ownership row
#   POST api/v1/unpublish  -> admin deprovisions everything (owner path)
#   verify                -> host gone, ownership gone, repo gone
#
# Plus the cheap deterministic surfaces around it: service health, storefront +
# creator-feed reads, and the auth gates (endpoints that must 401 unauthed).
#
# This is distinct from the other monitors:
#   - prod-smoke.yml   guards the runtime backend + SDK consumer path
#   - e2e-live.yml     guards the storefront + quality reporter (Playwright)
#   - THIS             guards the end-to-end provisioning pipeline
#
# Required secret:
#   FAS_E2E_GITHUB_TOKEN  A low-privilege canary creator GitHub token (read:user).
#                         The backend /v1/auth/exchange verifies it against
#                         GitHub /user and mints a fresh fas session. Without it,
#                         the run fails loudly (set it, or delete this workflow).

on:
  schedule:
    - cron: '23 */6 * * *' # every 6h, offset from the other monitors
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/prod-platform-e2e.mjs'
      - '.github/workflows/prod-platform-e2e.yml'

permissions:
  contents: read
  issues: write # open / comment on a failure issue

jobs:
  platform-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run production platform e2e
        env:
          FAS_E2E_GITHUB_TOKEN: ${{ secrets.FAS_E2E_GITHUB_TOKEN }}
        run: node scripts/prod-platform-e2e.mjs

      - name: Open / update issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const issueLabel = 'prod-platform-e2e-failure'
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = `Prod platform e2e failed at ${new Date().toISOString()}.

            See run: ${runUrl}

            This exercises the real create -> provision -> deploy -> cleanup pipeline.
            A leaked canary app (id \`e2e-canary-*\`) may need manual cleanup via the
            admin dashboard if the run died between publish and unpublish.

            Re-run the workflow manually after fixing to verify, or comment \`/close\` once recovered.`

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: issueLabel,
              state: 'open',
            })

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              })
              console.log(`commented on existing issue #${existing[0].number}`)
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔥 prod-platform-e2e failing',
                labels: [issueLabel],
                body,
              })
              console.log('opened new issue')
            }
