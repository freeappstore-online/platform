name: Prod smoke

# Periodic end-to-end smoke against live prod. Catches the bug class that
# unit + scaffold-smoke can't see:
# - Worker died / D1 unreachable / Durable Object misconfigured
# - publish.yml shipped a regressed @freeappstore/sdk where Proxy is missing
# - Auth flow broke (long-lived test session no longer accepted)
# - Compliance check started failing on a known-good fixture (proxy 5xx, etc.)
# - APP_SECRET_KEK rotation / unset
#
# Counterpart to scaffold-smoke (which guards the *new contributor* path)
# and e2e-live (which guards the *visual storefront* path). This guards
# the *runtime backend + SDK consumer* path.
#
# Frequency: every 30 minutes. Cheap (~30s per run, GH minutes free for
# public repos). Any non-success result — failed assertion, hang, cancelled
# runner — opens a GitHub issue carrying the failing step and its error text.
# A repeat of the SAME failure is suppressed for 6h; a change of cause always
# gets through. (Before that, every run commented: a month of one missing
# secret put 590 identical comments on #34.)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prod-smoke.yml'

permissions:
  contents: read
  issues: write   # so we can open / comment on a failure issue

env:
  API_BASE: https://api.freeappstore.online
  MCP_BASE: https://mcp.freeappstore.online
  TEST_APP_ID: smoke-sandbox      # owned by the canary account (serge-the-dev) — steps 5 requires the token owner to own this app

jobs:
  smoke:
    runs-on: ubuntu-latest
    # A healthy run is ~10-30s. Without a cap the job inherits the 360m default:
    # on 2026-08-06 two runs sat idle ~15m before infra killed them. Fail fast so
    # the notify job reports a hang promptly instead of hours later.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 1. API health
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 "$API_BASE/health")
          echo "GET /health → $code"
          test "$code" = "200"

      - name: 2. published SDK has all 4 modules
        run: |
          set -euo pipefail
          mkdir -p /tmp/smoke-sdk && cd /tmp/smoke-sdk
          npm init -y > /dev/null
          npm install @freeappstore/sdk@latest --silent
          # Assert all 4 modules wire up via initApp()
          node --input-type=module -e "
            import { initApp } from '@freeappstore/sdk'
            const fas = initApp({ appId: 'smoke', apiBase: 'https://api.freeappstore.online' })
            const required = ['auth', 'kv', 'rooms', 'proxy']
            const missing = required.filter(k => !fas[k])
            if (missing.length) { console.error('missing modules:', missing); process.exit(1) }
            console.log('  modules:', Object.keys(fas).join(', '))
          "

      # The MCP origin must reject protocol clients rather than answer them
      # with a 200 (#24). A client registered against the origin instead of
      # /mcp opens the legacy SSE transport there; a 200 with a body that ends
      # immediately reads as "stream opened, then dropped", and the client
      # redials ~1/sec forever — 91,806 requests in one day on the project
      # where this was first seen, at a 100% success rate with no AI spend, so
      # no other check here would go red. This is asserted from outside the
      # repo because the in-code guard has already been deleted once by a
      # refactor (the OAuth 2.1 layer replaced the hand-written fetch() and
      # took the guard with it on 2026-08-09; nothing noticed until 2026-09-12).
      - name: 2b. MCP origin rejects protocol clients
        run: |
          set -euo pipefail
          sse=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 \
            -H 'Accept: text/event-stream' "$MCP_BASE/")
          post=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 -X POST \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' "$MCP_BASE/")
          mcp=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 \
            -H 'Accept: text/event-stream' "$MCP_BASE/mcp")
          # A stream request on a path that is neither / nor /mcp. Newer `agents`
          # releases route a bare GET on ANY path into the legacy SSE handler with
          # no base-path check (#57); OAuthProvider's apiRoute and the Hono guard
          # are what keep that from opening a DO-backed stream. Assert it here so a
          # future dependency bump cannot silently turn 405 into an open stream.
          other=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 \
            -H 'Accept: text/event-stream' "$MCP_BASE/not-mcp")
          echo "GET / (Accept: text/event-stream) → $sse | POST / → $post | GET /mcp → $mcp | GET /not-mcp (SSE) → $other"
          test "$sse" = "405"
          test "$post" = "405"
          # /mcp must still answer the OAuth challenge: 401 proves the catch-all
          # did not swallow the real endpoint along with the wrong ones.
          test "$mcp" = "401"
          test "$other" = "405"

      # Mint a FRESH session each run by exchanging a long-lived, low-privilege
      # GitHub token — same pattern as FGS's prod-create-canary. Avoids the old
      # PROD_SMOKE_SESSION_TOKEN, which was a 30-day session that silently expired
      # and red-lit the monitor. FAS_E2E_GITHUB_TOKEN must be a user access token
      # issued to FAS's OWN GitHub OAuth app — i.e. minted through the device flow
      # as the smoke user, the same way `fas login` does it.
      #
      # A PAT no longer works (#47): /auth/exchange now introspects the token with
      # GitHub's app-authenticated check-token endpoint and 401s anything not
      # issued to FAS's client_id, so a PAT — which belongs to no OAuth app — is
      # rejected. This secret held a fine-grained PAT before that change and has
      # to be re-minted via the device flow.
      #
      # A missing token is FATAL, deliberately. This used to `exit 0` with a
      # warning so the run stayed green — and because the secret was never
      # actually created, steps 3-6 skipped silently from 2026-07-20 to
      # 2026-08-11 while the badge stayed green. Three weeks of zero
      # authenticated coverage, reported as health. A monitor that cannot run
      # its own checks must be red, never green.
      - name: Mint a fresh session (exchange the canary GitHub token)
        env:
          FAS_E2E_GITHUB_TOKEN: ${{ secrets.FAS_E2E_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FAS_E2E_GITHUB_TOKEN:-}" ]; then
            echo "::error::FAS_E2E_GITHUB_TOKEN is not set, so steps 3-6 (auth, KV, proxy, rooms) cannot run. Failing rather than skipping — a green run here would mean 'untested', not 'healthy'. See ops/SKILLS.md → 'Provisioning FAS_E2E_GITHUB_TOKEN'."
            exit 1
          fi
          # Capture the status separately from the body, and check it BEFORE
          # parsing. /v1/auth/exchange answers with PLAIN TEXT on every failure
          # path ('github token was not issued to this application', 'token
          # exchange is not configured'), so parsing first turned a clear 401
          # into a JSONDecodeError traceback — in the alert, at exactly the
          # moment someone is trying to provision this secret.
          resp=$(curl -sS -X POST "$API_BASE/v1/auth/exchange" \
            -H "Content-Type: application/json" \
            -w $'\n%{http_code}' \
            --data "{\"githubToken\":\"$FAS_E2E_GITHUB_TOKEN\"}")
          code="${resp##*$'\n'}"
          body="${resp%$'\n'*}"
          if [ "$code" != "200" ]; then
            echo "::error::/v1/auth/exchange returned HTTP $code: ${body:0:300}"
            if printf '%s' "$body" | grep -q 'not issued to this application'; then
              echo "::error::FAS_E2E_GITHUB_TOKEN is the wrong KIND of token. It must be a device-flow user access token for FAS's own OAuth app (client_id Ov23liuUpYPXc1ikEFm2) — a PAT belongs to no OAuth app and is rejected. See ops/SKILLS.md → 'Provisioning FAS_E2E_GITHUB_TOKEN'."
            fi
            exit 1
          fi
          token=$(printf '%s' "$body" | python3 -c "import sys,json; d=json.load(sys.stdin); t=d.get('sessionToken'); print(t) if t else sys.exit('exchange returned 200 but no sessionToken: '+str(d)[:200])")
          login=$(printf '%s' "$body" | python3 -c "import sys,json; print(json.load(sys.stdin).get('user',{}).get('login','?'))")
          echo "::add-mask::$token"
          echo "SESSION_TOKEN=$token" >> "$GITHUB_ENV"
          echo "  minted a fresh session for @$login"

      - name: 3. authenticated round-trip — apps/mine
        run: |
          set -euo pipefail
          # apps/mine returns the session-owner's app list; we just check it's a 200 + JSON object
          body=$(curl -sS -H "Authorization: Bearer $SESSION_TOKEN" "$API_BASE/v1/apps/mine")
          echo "  /apps/mine returned $(echo "$body" | wc -c) bytes"
          BODY="$body" python3 <<'PY'
          import os, json, sys
          d = json.loads(os.environ['BODY'])
          if not isinstance(d.get('apps'), list):
              print('apps key missing or not a list:', d); sys.exit(1)
          print(f'  {len(d["apps"])} apps owned by session user')
          PY

      - name: 4. KV round-trip
        run: |
          set -euo pipefail
          KEY="prod-smoke-$(date +%s)"
          # PUT
          code=$(curl -sS -X PUT -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $SESSION_TOKEN" -H "Content-Type: application/json" \
            --data '{"hello":"smoke","ts":'"$(date +%s)"'}' \
            "$API_BASE/v1/apps/$TEST_APP_ID/kv/$KEY")
          echo "  PUT $KEY → $code"
          test "$code" = "204"
          # GET
          body=$(curl -sS -H "Authorization: Bearer $SESSION_TOKEN" "$API_BASE/v1/apps/$TEST_APP_ID/kv/$KEY")
          echo "  GET $KEY → $body"
          BODY="$body" python3 <<'PY'
          import os, json
          d = json.loads(os.environ['BODY'])
          assert d.get('hello') == 'smoke', f'expected hello=smoke, got {d}'
          PY
          # DELETE (cleanup)
          code=$(curl -sS -X DELETE -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $SESSION_TOKEN" \
            "$API_BASE/v1/apps/$TEST_APP_ID/kv/$KEY")
          echo "  DELETE $KEY → $code"
          test "$code" = "204"

      - name: 5. Proxy register + fetch + cleanup
        run: |
          set -euo pipefail
          NAME="PROD_SMOKE_KEY"
          # Register secret
          curl -sS --fail -X PUT \
            -H "Authorization: Bearer $SESSION_TOKEN" -H "Content-Type: application/json" \
            --data '{"value":"smoke-value-12345"}' \
            "$API_BASE/v1/apps/$TEST_APP_ID/secrets/$NAME" > /dev/null
          echo "  ✓ secret registered"
          # Register allowlist (httpbin echoes injected secret back to us)
          curl -sS --fail -X PUT \
            -H "Authorization: Bearer $SESSION_TOKEN" -H "Content-Type: application/json" \
            --data '{"pattern":"https://httpbin.org/","injectKind":"header","injectName":"X-Smoke-Key","secretName":"'"$NAME"'","methods":["GET"]}' \
            "$API_BASE/v1/apps/$TEST_APP_ID/allowlist" > /dev/null
          echo "  ✓ allowlist registered"
          # Call via proxy
          body=$(curl -sS --fail -H "Authorization: Bearer $SESSION_TOKEN" \
            "$API_BASE/v1/apps/$TEST_APP_ID/proxy/httpbin.org/headers")
          BODY="$body" python3 <<'PY'
          import os, json, sys
          d = json.loads(os.environ['BODY'])
          v = d.get('headers', {}).get('X-Smoke-Key')
          if v != 'smoke-value-12345':
              print(f'expected X-Smoke-Key=smoke-value-12345, got {v}'); sys.exit(1)
          print('  ✓ proxy injected secret correctly')
          PY
          # Cleanup (best-effort — failure here is logged, not fatal)
          curl -sS -X DELETE -H "Authorization: Bearer $SESSION_TOKEN" -H "Content-Type: application/json" \
            --data '{"pattern":"https://httpbin.org/"}' \
            "$API_BASE/v1/apps/$TEST_APP_ID/allowlist" > /dev/null || true
          curl -sS -X DELETE -H "Authorization: Bearer $SESSION_TOKEN" \
            "$API_BASE/v1/apps/$TEST_APP_ID/secrets/$NAME" > /dev/null || true
          echo "  ✓ cleanup done"

      - name: 6. Rooms WebSocket round-trip via published SDK
        run: |
          set -euo pipefail
          cd /tmp/smoke-sdk   # already has @freeappstore/sdk@latest from step 2
          npm install ws --silent
          # The SDK's Auth class reads from browser localStorage; in Node we
          # inject the token directly. Same trick as our local SDK smoke.
          SESSION_TOKEN="$SESSION_TOKEN" API_BASE="$API_BASE" TEST_APP_ID="$TEST_APP_ID" \
          node --input-type=module -e "
            import { initApp } from '@freeappstore/sdk'
            import { WebSocket } from 'ws'
            globalThis.WebSocket ||= WebSocket
            const fas = initApp({ appId: process.env.TEST_APP_ID, apiBase: process.env.API_BASE })
            Object.defineProperty(fas.auth, 'token', { get() { return process.env.SESSION_TOKEN } })

            const room = fas.rooms.join('prod-smoke-room-' + Date.now())
            await new Promise((res, rej) => {
              const t = setTimeout(() => rej(new Error('timeout, last state: ' + room.state)), 12000)
              if (room.state === 'open') { clearTimeout(t); return res() }
              const off = room.onConnectionState(s => {
                if (s === 'open') { clearTimeout(t); off(); res() }
                if (s === 'closed' || s === 'error') { clearTimeout(t); off(); rej(new Error('unexpected state ' + s)) }
              })
            })
            console.log('  ✓ room open')
            room.send({ ping: 'prod-smoke' })
            await new Promise(r => setTimeout(r, 600))
            if (room.state !== 'open') { console.error('connection dropped'); process.exit(1) }
            console.log('  ✓ send did not throw, still open')
            room.close()
            await new Promise(r => setTimeout(r, 400))
            if (room.state !== 'closed') { console.error('did not close cleanly'); process.exit(1) }
            console.log('  ✓ closed cleanly')
            // ws keeps the event loop alive even after close; exit explicitly.
            process.exit(0)
          "

  # Deliberately a SEPARATE job, not a final step of `smoke`. It gets its own
  # runner, so it still reports when the smoke runner never comes up. On
  # 2026-08-06 two runs were allocated, executed ZERO steps, and were cancelled
  # ~15m later — an in-job notifier (even guarded with `cancelled()`) could
  # never have fired, so both incidents passed silently.
  #
  # `needs.smoke.result` covers failure, cancelled and skipped alike, which is
  # what we want: anything that is not a green smoke run deserves a shout.
  # Residual gap: if the whole workflow RUN is cancelled, this job can be torn
  # down with it. Catching that needs an out-of-run `workflow_run` watchdog.
  notify:
    needs: smoke
    if: always() && needs.smoke.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open / update the failure issue
        uses: actions/github-script@v7
        env:
          SMOKE_RESULT: ${{ needs.smoke.result }}
        with:
          script: |
            const issueLabel = 'prod-smoke-failure'
            const result = process.env.SMOKE_RESULT
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            // Don't re-post the same diagnosis more often than this. See the
            // dedup note below.
            const REPEAT_AFTER_MS = 6 * 60 * 60 * 1000

            // The GitHub API 5xxs often enough to lose an alert outright: on
            // 2026-07-20T01:00 a real failure went unreported because this call
            // died with "No server is currently available to service your request".
            const retry = async (label, fn) => {
              let lastErr
              for (let attempt = 1; attempt <= 4; attempt++) {
                try {
                  return await fn()
                } catch (err) {
                  lastErr = err
                  const status = err.status ?? 0
                  // 4xx (bad token, missing scope, gone) will never heal by waiting.
                  if (status >= 400 && status < 500 && status !== 429) throw err
                  if (attempt === 4) break
                  const waitMs = 2000 * 2 ** (attempt - 1)
                  core.warning(`${label} attempt ${attempt}/4 failed (${status || 'no status'}): ${err.message} — retrying in ${waitMs}ms`)
                  await new Promise(r => setTimeout(r, waitMs))
                }
              }
              throw lastErr
            }

            // Which step actually broke, and what it said. Without this the alert
            // is just "it failed, go read a log" — which is what let a missing
            // secret masquerade as a prod incident for a month.
            let failedSteps = []
            let errorLines = []
            try {
              const { data: jobs } = await retry('listJobs', () =>
                github.rest.actions.listJobsForWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: context.runId,
                }))
              for (const job of jobs.jobs ?? []) {
                if (job.name === 'notify') continue
                for (const step of job.steps ?? []) {
                  if (step.conclusion === 'failure') failedSteps.push(step.name)
                }
                // ::error:: lines surface as check-run annotations.
                const checkRunId = Number(String(job.check_run_url ?? '').split('/').pop())
                if (!Number.isFinite(checkRunId)) continue
                const { data: ann } = await retry('listAnnotations', () =>
                  github.rest.checks.listAnnotations({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    check_run_id: checkRunId,
                  }))
                for (const a of ann ?? []) {
                  if (a.annotation_level === 'failure' && a.message) errorLines.push(a.message.trim())
                }
              }
            } catch (err) {
              // Never let diagnosis-gathering cost us the alert itself.
              core.warning(`could not collect failure detail: ${err.message}`)
            }

            // Identity of THIS failure, so a repeat is recognisable and a change
            // of cause always gets through.
            const signature = [result, ...failedSteps, ...errorLines.map(l => l.slice(0, 120))].join(' | ') || result
            // Hash, don't truncate: base64 of the raw signature sliced to 64 chars
            // only covers the first 48 BYTES, which are the same for every
            // failure at a given step — so two different errors collided and the
            // second was wrongly suppressed as a repeat.
            const crypto = require('node:crypto')
            const marker = `<!-- prod-smoke-sig: ${crypto.createHash('sha256').update(signature).digest('hex').slice(0, 32)} -->`

            const headline = result === 'cancelled'
              ? `Prod smoke was **cancelled** at ${new Date().toISOString()} (hang or runner/infra failure — usually not a prod regression).`
              : `Prod smoke **${result}** at ${new Date().toISOString()}.`

            const detail = failedSteps.length
              ? `\n**Failed step:** ${failedSteps.join(', ')}\n`
              : '\n_No failed step recorded — the runner may never have started._\n'
            const errors = errorLines.length
              ? `\n\`\`\`\n${errorLines.join('\n').slice(0, 1500)}\n\`\`\`\n`
              : ''

            const body = `${headline}\n${detail}${errors}\nSee run: ${runUrl}\n\nRe-run the workflow manually after fixing to verify.\n\n${marker}`

            const { data: existing } = await retry('listForRepo', () =>
              github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: issueLabel,
                state: 'open',
              }))

            if (existing.length === 0) {
              const { data: created } = await retry('issues.create', () =>
                github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: '🔥 prod-smoke failing',
                  labels: [issueLabel],
                  body,
                }))
              core.info(`opened new issue #${created.number}`)
              return
            }

            const issue = existing[0]

            // Dedup. The old code commented on EVERY failure: a month of a
            // missing secret put 590 identical comments on #34, which is the
            // same as no alert at all. Re-post only when the cause changes, or
            // when the same cause has been going for another REPEAT_AFTER_MS —
            // so an ongoing outage still pings, just not 48 times a day.
            let last = null
            try {
              const total = issue.comments ?? 0
              const page = Math.max(1, Math.ceil(total / 100))
              const { data: comments } = await retry('listComments', () =>
                github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  per_page: 100,
                  page,
                }))
              last = comments.length ? comments[comments.length - 1] : null
            } catch (err) {
              core.warning(`could not read previous comments, will comment: ${err.message}`)
            }

            if (last && last.body?.includes(marker)) {
              const ageMs = Date.now() - new Date(last.created_at).getTime()
              if (ageMs < REPEAT_AFTER_MS) {
                core.info(
                  `same failure as #${issue.number}'s last comment (${Math.round(ageMs / 60000)}m ago) — not re-commenting. Signature: ${signature.slice(0, 200)}`,
                )
                return
              }
            }

            await retry('createComment', () =>
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              }))
            core.info(`commented on existing issue #${issue.number}`)
